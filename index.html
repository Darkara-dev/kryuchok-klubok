<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крючок и клубок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* Тёплая палитра, вдохновлённая мотками пряжи. Не подстраиваемся под тему
       Telegram (var(--tg-theme-*)) намеренно — у нас свой фирменный вид, и
       завязка на системную тему раньше приводила к невидимому светлому тексту
       на светлых карточках при тёмной теме Telegram. */
    --bg:#F3EDE2; --card:#FFFCF7; --border:#E6DCC9;
    --text:#3A2E28; --text-secondary:#8C7C6B;
    --accent:#A8536A; --accent-light:#F3E4E8;
    --done-bg:#F1EDE2; --done-text:#8A9A6B;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Nunito',-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    padding:0 16px 60px; margin:0;
  }
  h2{font-size:17px; margin:0; font-family:'Bitter',serif; font-weight:600;}
  #status{color:var(--text-secondary); font-size:13px; margin:10px 0 4px;}
  button{
    background:var(--accent); color:white; border:none;
    padding:11px 16px; border-radius:12px; font-size:14px; margin:4px 4px 4px 0;
    cursor:pointer; font-family:'Nunito',sans-serif; font-weight:700;
  }
  button.secondary{ background:var(--card); color:var(--text); border:1.5px solid var(--border); font-weight:600; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .back-btn{
    background:none; color:var(--accent); padding:4px 0; font-size:14px; font-weight:700;
    display:block; margin-top:20px; padding-top:14px; border-top:1.5px solid var(--border);
  }

  /* ---------- Шапка с зубчатым краем ---------- */
  .app-header{ margin:0 -16px 16px; }
  .app-header-bar{
    display:flex; align-items:center; gap:10px; padding:16px 18px 18px;
    color:white;
  }
  .app-header-back{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:rgba(255,255,255,0.22); border:none; color:white;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; padding:0; margin:0;
  }
  .app-header-title{
    font-family:'Bitter',serif; font-weight:700; font-size:21px;
    line-height:1.2; color:white;
  }
  .app-header-sub{ font-size:12px; color:rgba(255,255,255,0.8); margin-top:2px; }
  .picot-edge{ display:block; width:100%; margin-top:-1px; }

  /* ---------- Круглые "мотки пряжи" — иконки категорий ---------- */
  .yarn-circle{
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  .project-item, .section-block, .row-item{
    background:var(--card); border:1.5px solid var(--border); border-radius:14px;
    padding:12px; margin-bottom:10px;
  }
  .project-item{ cursor:pointer; display:flex; align-items:center; gap:12px; }
  .project-thumb{
    width:52px; height:52px; border-radius:12px; flex-shrink:0;
    object-fit:cover; background:var(--done-bg);
  }
  .project-info{ flex:1; min-width:0; }
  .photo-gallery{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .photo-gallery img{
    width:72px; height:72px; border-radius:12px; object-fit:cover;
    border:1.5px solid var(--border);
  }
  .project-badges{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; justify-content:center; }
  .badge-cat{
    font-size:11px; font-weight:700; background:var(--accent-light); color:var(--accent); padding:3px 9px; border-radius:8px;
  }
  .badge-tag{
    font-size:11px; font-weight:700; background:var(--done-bg); color:var(--done-text); padding:3px 9px; border-radius:8px;
  }
  .tag-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .tag-pill{
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:16px; border:1.5px solid var(--border);
    background:var(--card); color:var(--text-secondary); cursor:pointer;
  }
  .tag-pill.selected{ background:var(--accent); color:white; border-color:var(--accent); }
  .new-tag-row{ display:flex; gap:6px; margin-top:8px; }
  .new-tag-row input{ flex:1; padding:8px 10px; border:1.5px solid var(--border); border-radius:10px; font-size:13px; font-family:inherit; }
  .new-tag-row button{ padding:8px 12px; font-size:12px; margin:0; }
  select.form-select{
    width:100%; padding:10px 11px; border:1.5px solid var(--border); border-radius:10px;
    font-size:14px; font-family:inherit; background:var(--card); color:var(--text);
  }
  .row-item{ display:flex; align-items:flex-start; gap:10px; padding:11px 13px; }
  .row-item.done{ background:var(--done-bg); }
  .row-item.done .row-desc{ text-decoration:line-through; color:var(--done-text); }
  .row-num{
    font-weight:800; color:var(--accent); min-width:26px; font-size:12px;
    background:var(--accent-light); border-radius:7px; padding:2px 0; text-align:center; height:fit-content;
  }
  .row-desc{ flex:1; font-size:14px; color:var(--text); line-height:1.4; }
  .row-note{ font-size:12px; color:var(--text-secondary); margin-top:3px; }
  .sec-meta{ font-size:12px; color:var(--text-secondary); margin:2px 0 8px; }
  #view-project, #view-categories, #view-subcategories, #view-projects{ display:none; }

  .card-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;
  }
  .cat-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:18px;
    padding:0 0 14px; display:flex; flex-direction:column; align-items:center;
    gap:0; cursor:pointer; text-align:center; overflow:hidden;
  }
  .cat-card-icon-area{
    width:100%; height:96px; display:flex; align-items:center; justify-content:center;
    margin-bottom:10px;
  }
  .cat-card-name{ font-size:14px; font-weight:600; font-family:'Bitter',serif; color:var(--text); padding:0 8px; }
  .cat-card-meta{ font-size:11px; color:var(--text-secondary); margin-top:3px; }
  .project-card-img{
    width:100%; aspect-ratio:1; object-fit:cover; background:var(--done-bg);
  }

  .inline-form{
    background:#FBF7EF; border:1.5px solid var(--border); border-radius:14px;
    padding:14px; margin:8px 0 14px;
  }
  .inline-form label{ display:block; font-size:12px; color:var(--text-secondary); margin:8px 0 3px; font-weight:600; }
  .inline-form label:first-child{ margin-top:0; }
  .inline-form input, .inline-form textarea{
    width:100%; padding:10px 11px; border:1.5px solid var(--border); border-radius:10px;
    font-size:14px; font-family:inherit; background:var(--card); color:var(--text);
  }
  .inline-form textarea{ resize:vertical; min-height:44px; }
  .form-actions{ margin-top:12px; }

  .icon-btn{
    background:none; border:none; padding:4px 6px; font-size:14px;
    color:var(--text-secondary); margin:0;
  }
  .row-actions{ display:flex; gap:2px; align-items:center; }
  .sec-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sec-header h2{ flex:1; }
  .project-title-row{ display:flex; align-items:center; gap:8px; }
  .project-title-row h2{ flex:1; font-size:13px; color:var(--text-secondary); font-weight:600; }

  /* ---------- Круглый бейдж прогресса детали (в духе крючка со счётчиком) ---------- */
  .part-badge{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; font-family:'Nunito',sans-serif;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(58,46,40,0.5);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-box{
    background:var(--card); border-radius:18px; padding:20px; max-width:340px; width:100%;
  }
  .modal-title{ font-weight:700; font-size:16px; margin-bottom:6px; font-family:'Bitter',serif; color:var(--text); }
  .modal-message{ font-size:13.5px; color:var(--text-secondary); margin-bottom:12px; line-height:1.4; }
  .modal-input{
    width:100%; padding:10px 11px; border:1.5px solid var(--border); border-radius:10px;
    font-size:14px; margin-bottom:12px; font-family:inherit;
  }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .btn-danger{ background:#B0392E; }

  /* ---------- Спиннер-клубок ---------- */
  #pdf-loading{
    display:none; flex-direction:column; align-items:center; gap:14px; margin:20px 0;
    font-size:13px; color:var(--text-secondary); text-align:center;
  }
  #pdf-loading.active{ display:flex; }
  .yarn-spinner-emoji{
    font-size:48px; line-height:1; display:inline-block; flex-shrink:0;
    animation:yarn-spin 1.6s linear infinite;
  }
  @keyframes yarn-spin{ to{ transform:rotate(360deg); } }
  #toast{
    position:fixed; left:16px; right:16px; bottom:16px;
    background:#7C3E51; color:white; padding:10px 14px; border-radius:12px;
    font-size:13px; display:none; z-index:10;
  }
</style>
</head>
<body>
  <div class="app-header" id="app-header"></div>
  <p id="status">Подключаемся к базе...</p>

  <div id="view-categories">
    <input type="text" id="search-input" placeholder="Поиск по тегам или названию..." style="width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14px; margin:10px 0; font-family:inherit; background:var(--card); color:var(--text);">
    <button id="add-project-home-btn">+ Новый проект</button>
    <div id="project-form-holder-home"></div>
    <div id="search-results" class="card-grid"></div>
    <h2 style="margin:22px 0 0;" id="category-grid-title">Категории</h2>
    <div id="category-grid" class="card-grid"></div>
    <div id="recent-projects-block" style="display:none; margin-top:22px;">
      <h2 style="margin-bottom:10px;">Недавние проекты</h2>
      <div id="recent-projects-list"></div>
    </div>
  </div>

  <div id="view-subcategories">
    <h2 id="category-title"></h2>
    <button id="add-project-category-btn">+ Новый проект</button>
    <div id="project-form-holder-category"></div>
    <div id="subcategory-grid" class="card-grid"></div>
    <button class="back-btn" id="back-to-categories-btn">← Категории</button>
  </div>

  <div id="view-projects">
    <h2 id="subcategory-title"></h2>
    <button id="add-project-btn">+ Новый проект</button>
    <div id="project-form-holder"></div>
    <div id="project-list" class="card-grid"></div>
    <button class="back-btn" id="back-to-subcategories-btn">← <span id="back-to-subcategories-label"></span></button>
  </div>

  <div id="view-project">
    <button class="back-btn" id="back-btn" style="margin-top:0; padding-top:0; border-top:none;">← Проекты</button>
    <div class="project-title-row">
      <h2 id="project-title"></h2>
      <button id="edit-project-btn" class="icon-btn" title="Редактировать проект">✎</button>
      <button id="delete-project-btn" class="icon-btn" title="Удалить проект">🗑</button>
    </div>
    <div id="project-edit-form-holder"></div>
    <div id="photo-gallery" class="photo-gallery"></div>
    <button id="upload-photo-btn" class="secondary">📷 Добавить фото готовой работы</button>
    <input type="file" id="photo-input" accept="image/*" style="display:none;">
    <button id="upload-pdf-btn">📄 Загрузить PDF-схему</button>
    <button id="add-section-btn" class="secondary">Добавить деталь вручную</button>
    <input type="file" id="pdf-input" accept="application/pdf" style="display:none;">
    <div id="pdf-loading">
      <span class="yarn-spinner-emoji">🧶</span>
      <span id="pdf-loading-text">Разбираем схему...</span>
    </div>
    <div id="section-form-holder"></div>
    <div id="section-list"></div>
  </div>

  <div id="toast"></div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    // ---------- ID пользователя (для личного прогресса по рядам) ----------
    function getUserId() {
      try {
        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        if (tgUser && tgUser.id) return String(tgUser.id);
      } catch (e) {}
      return 'browser-test'; // резервный ID, если открыто не в Telegram (например для проверки в браузере)
    }
    const currentUserId = getUserId();

    const SUPABASE_URL = 'https://vcsgpauejnqznygdqxyo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MRJ8BbTV9cvAnygOzySE7A_k29SDSuD';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const statusEl = document.getElementById('status');
    const appHeaderEl = document.getElementById('app-header');
    const viewCategories = document.getElementById('view-categories');
    const viewSubcategories = document.getElementById('view-subcategories');
    const viewProjects = document.getElementById('view-projects');
    const viewProject = document.getElementById('view-project');
    const categoryGridEl = document.getElementById('category-grid');
    const subcategoryGridEl = document.getElementById('subcategory-grid');
    const categoryTitleEl = document.getElementById('category-title');
    const subcategoryTitleEl = document.getElementById('subcategory-title');
    const backToSubcatLabelEl = document.getElementById('back-to-subcategories-label');
    const searchResultsEl = document.getElementById('search-results');
    const recentProjectsBlockEl = document.getElementById('recent-projects-block');
    const recentProjectsListEl = document.getElementById('recent-projects-list');
    const categoryGridTitleEl = document.getElementById('category-grid-title');
    const projectListEl = document.getElementById('project-list');
    const sectionListEl = document.getElementById('section-list');
    const projectTitleEl = document.getElementById('project-title');
    const projectFormHolder = document.getElementById('project-form-holder');
    const sectionFormHolder = document.getElementById('section-form-holder');
    const toastEl = document.getElementById('toast');
    const searchInput = document.getElementById('search-input');

    let currentProjectId = null;
    let currentCategoryId = null;
    let currentSubcategoryId = null;
    let allCategories = [];
    let allTags = [];
    let projectsCache = [];
    let photoMap = {}; // project_id -> url последнего фото (для миниатюры в каталоге)

    // ---------- Фирменные цвета по названию категории (как разные цвета пряжи) ----------
    // Для новых категорий, которые пользователь создаёт сам, используется общий бренд-цвет (запасной)
    const CATEGORY_COLORS = {
      'Одежда':      { main: '#C17A4E', light: '#F5EAE0' },
      'Игрушки':     { main: '#D9A441', light: '#FAF0D5' },
      'Для дома':    { main: '#8A9A6B', light: '#E8EEE0' },
      'Аксессуары':  { main: '#5B7C99', light: '#DCE9F3' },
    };
    const FALLBACK_COLOR = { main: '#A8536A', light: '#F3E4E8' };

    function getTopCategoryOf(subcategoryId) {
      const subcat = allCategories.find(c => c.id === subcategoryId);
      if (!subcat) return null;
      return subcat.parent_id ? allCategories.find(c => c.id === subcat.parent_id) : subcat;
    }

    function getColorForCategoryName(name) {
      return CATEGORY_COLORS[name] || FALLBACK_COLOR;
    }

    function getColorForSubcategory(subcategoryId) {
      const top = getTopCategoryOf(subcategoryId);
      return top ? getColorForCategoryName(top.name) : FALLBACK_COLOR;
    }

    // ---------- Зубчатый край (обвязка крючком) под цветной шапкой ----------
    function picotEdgeSvg(fillColor) {
      const W = 400, R = 9, N = 23;
      const step = (W - 2 * R) / (N - 1);
      let circles = '';
      for (let i = 0; i < N; i++) {
        const cx = R + i * step;
        circles += `<circle cx="${cx}" cy="${R}" r="${R}" fill="${fillColor}"/>`;
      }
      return `<svg class="picot-edge" viewBox="0 0 ${W} ${R * 2}" preserveAspectRatio="none" style="height:${R * 2}px;" aria-hidden="true">
        <rect x="0" y="0" width="${W}" height="${R}" fill="${fillColor}"/>${circles}
      </svg>`;
    }

    // ---------- Отрисовка шапки приложения ----------
    // color: hex цвет фона шапки; title/subtitle: текст; onBack: функция или null (без кнопки назад)
    function renderAppHeader(color, title, subtitle, onBack) {
      appHeaderEl.innerHTML = `
        <div class="app-header-bar" style="background:${color};">
          ${onBack ? '<button class="app-header-back" id="app-header-back-btn">‹</button>' : ''}
          <div style="flex:1; min-width:0;">
            <div class="app-header-title">${title}</div>
            ${subtitle ? `<div class="app-header-sub">${subtitle}</div>` : ''}
          </div>
        </div>
        ${picotEdgeSvg(color)}
      `;
      if (onBack) {
        document.getElementById('app-header-back-btn').addEventListener('click', onBack);
      }
    }

    // ---------- Круглый "моток пряжи" — иконка категории/проекта ----------
    function yarnCircleHtml(color, size, emoji, fontSize) {
      return `<div class="yarn-circle" style="width:${size}px; height:${size}px; font-size:${fontSize}px;
        background:radial-gradient(circle at 36% 32%, ${color}, ${color}dd 55%, ${color}); ">${emoji}</div>`;
    }

    function yarnCircleEl(color, size, emoji, fontSize) {
      const div = document.createElement('div');
      div.className = 'yarn-circle';
      div.style.width = size + 'px';
      div.style.height = size + 'px';
      div.style.fontSize = fontSize + 'px';
      div.style.background = `radial-gradient(circle at 36% 32%, ${color}f0, ${color} 55%, ${color}cc)`;
      div.textContent = emoji;
      return div;
    }

    // ---------- Уведомления об ошибках ----------
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      setTimeout(() => { toastEl.style.display = 'none'; }, 4000);
    }

    // ---------- Модалка подтверждения удаления ----------
    // requireWord: если задано (например "Удалить"), кнопка активна только когда текст совпал
    function showConfirmModal({ title, message, requireWord, onConfirm }) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      const box = document.createElement('div');
      box.className = 'modal-box';

      const h = document.createElement('div');
      h.className = 'modal-title';
      h.textContent = title;
      box.appendChild(h);

      const msg = document.createElement('div');
      msg.className = 'modal-message';
      msg.textContent = message;
      box.appendChild(msg);

      let confirmInput = null;
      if (requireWord) {
        confirmInput = document.createElement('input');
        confirmInput.className = 'modal-input';
        confirmInput.placeholder = 'Введите "' + requireWord + '"';
        box.appendChild(confirmInput);
      }

      const actions = document.createElement('div');
      actions.className = 'modal-actions';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';

      const okBtn = document.createElement('button');
      okBtn.className = 'btn-danger';
      okBtn.textContent = 'Удалить';
      if (requireWord) okBtn.disabled = true;

      actions.appendChild(cancelBtn);
      actions.appendChild(okBtn);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      if (requireWord) {
        confirmInput.addEventListener('input', () => {
          okBtn.disabled = confirmInput.value.trim() !== requireWord;
        });
      }

      cancelBtn.addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      okBtn.addEventListener('click', async () => {
        if (requireWord && confirmInput.value.trim() !== requireWord) return;
        okBtn.disabled = true;
        await onConfirm();
        overlay.remove();
      });
    }

    // ---------- Помощник: создать инлайн-форму ----------
    // fields: [{name, label, type: 'text'|'number'|'textarea', placeholder}]
    function buildForm(fields, onSubmit, submitLabel) {
      const form = document.createElement('div');
      form.className = 'inline-form';

      const inputs = {};
      fields.forEach(f => {
        const label = document.createElement('label');
        label.textContent = f.label;
        form.appendChild(label);

        const input = f.type === 'textarea'
          ? document.createElement('textarea')
          : document.createElement('input');
        if (f.type !== 'textarea') input.type = f.type || 'text';
        if (f.placeholder) input.placeholder = f.placeholder;
        form.appendChild(input);
        inputs[f.name] = input;
      });

      const actions = document.createElement('div');
      actions.className = 'form-actions';

      const saveBtn = document.createElement('button');
      saveBtn.textContent = submitLabel || 'Сохранить';
      actions.appendChild(saveBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(cancelBtn);

      form.appendChild(actions);

      cancelBtn.addEventListener('click', () => form.remove());
      saveBtn.addEventListener('click', async () => {
        const values = {};
        fields.forEach(f => { values[f.name] = inputs[f.name].value.trim(); });
        saveBtn.disabled = true;
        await onSubmit(values, form);
        saveBtn.disabled = false;
      });

      return form;
    }

    // ---------- Категории и теги (общие справочники) ----------
    async function loadCategories() {
      const { data, error } = await sb.from('categories').select('*').order('name');
      if (error) { showToast('Ошибка загрузки категорий: ' + error.message); return; }
      allCategories = data || [];
    }

    async function loadTags() {
      const { data, error } = await sb.from('tags').select('*').order('name');
      if (error) { showToast('Ошибка загрузки тегов: ' + error.message); return; }
      allTags = data || [];
    }

    function getCategoryName(id) {
      const cat = allCategories.find(c => c.id === id);
      return cat ? cat.name : null;
    }

    function getCategoryIcon(subcategoryId) {
      const subcat = allCategories.find(c => c.id === subcategoryId);
      if (!subcat) return '🧶';
      if (subcat.icon) return subcat.icon;
      const parent = subcat.parent_id ? allCategories.find(c => c.id === subcat.parent_id) : null;
      return (parent && parent.icon) || '🧶';
    }

    async function loadPhotoMap() {
      const { data, error } = await sb.from('photos').select('*').order('created_at', { ascending: false });
      if (error) { showToast('Ошибка загрузки фото: ' + error.message); return; }
      photoMap = {};
      (data || []).forEach(p => {
        if (!photoMap[p.project_id]) photoMap[p.project_id] = p.url; // первое = самое свежее
      });
    }

    // ---------- Личный прогресс по рядам (свой для каждого пользователя Telegram) ----------
    async function loadRowProgress(rowIds) {
      if (!rowIds.length) return new Set();
      const { data, error } = await sb
        .from('row_progress')
        .select('row_id')
        .eq('telegram_user_id', currentUserId)
        .in('row_id', rowIds);
      if (error) { showToast('Ошибка загрузки прогресса: ' + error.message); return new Set(); }
      return new Set((data || []).map(x => x.row_id));
    }

    // ---------- Загрузка всех проектов (кэш для поиска и списков по подкатегориям) ----------
    async function loadProjects() {
      const { data, error } = await sb
        .from('projects')
        .select('*, project_tags(tags(name))')
        .order('created_at', { ascending: false });
      if (error) { showToast('Ошибка: ' + error.message); return; }
      projectsCache = data || [];
      statusEl.textContent = 'Проектов: ' + projectsCache.length;
    }

    // ---------- Недавние проекты с прогресс-баром (на главном экране) ----------
    async function renderRecentProjects() {
      recentProjectsBlockEl.style.display = 'block';
      recentProjectsListEl.innerHTML = '';

      // 1. Берём последние по времени отметки ряда этого пользователя
      const { data: progressRows, error: progError } = await sb
        .from('row_progress')
        .select('row_id, updated_at')
        .eq('telegram_user_id', currentUserId)
        .order('updated_at', { ascending: false })
        .limit(150);

      if (progError) { showToast('Ошибка: ' + progError.message); return; }

      if (!progressRows || !progressRows.length) {
        recentProjectsListEl.appendChild(emptyMessage('Вы ещё не начали ни одного проекта'));
        return;
      }

      // 2. Ряд -> деталь -> проект, чтобы понять, какому проекту принадлежит каждая отметка
      const recentRowIds = progressRows.map(pr => pr.row_id);
      const { data: rowsData } = await sb.from('rows').select('id, section_id').in('id', recentRowIds);
      const rowToSection = {};
      (rowsData || []).forEach(r => { rowToSection[r.id] = r.section_id; });

      const sectionIds = [...new Set(Object.values(rowToSection))];
      let sectionToProject = {};
      if (sectionIds.length) {
        const { data: sectionsData } = await sb.from('sections').select('id, project_id').in('id', sectionIds);
        (sectionsData || []).forEach(s => { sectionToProject[s.id] = s.project_id; });
      }

      // 3. Идём по отметкам от самой свежей и берём первые 3 РАЗНЫХ проекта
      const recentProjectIds = [];
      for (const pr of progressRows) {
        const secId = rowToSection[pr.row_id];
        const projId = sectionToProject[secId];
        if (projId && !recentProjectIds.includes(projId)) {
          recentProjectIds.push(projId);
          if (recentProjectIds.length === 3) break;
        }
      }

      if (!recentProjectIds.length) {
        recentProjectsListEl.appendChild(emptyMessage('Вы ещё не начали ни одного проекта'));
        return;
      }

      const recent = recentProjectIds
        .map(id => projectsCache.find(p => p.id === id))
        .filter(Boolean);

      // 4. Считаем прогресс (done/total) по каждому из этих проектов — уже среди ВСЕХ его рядов
      const { data: allSections } = await sb.from('sections').select('id, project_id').in('project_id', recentProjectIds);
      const allSectionIds = (allSections || []).map(s => s.id);
      const allSectionToProject = {};
      (allSections || []).forEach(s => { allSectionToProject[s.id] = s.project_id; });

      let allRows = [];
      if (allSectionIds.length) {
        const { data } = await sb.from('rows').select('id, section_id').in('section_id', allSectionIds);
        allRows = data || [];
      }

      let allCheckedRowIds = new Set();
      if (allRows.length) {
        const allRowIds = allRows.map(r => r.id);
        const { data } = await sb.from('row_progress').select('row_id')
          .eq('telegram_user_id', currentUserId).in('row_id', allRowIds);
        allCheckedRowIds = new Set((data || []).map(x => x.row_id));
      }

      const totals = {}; // projectId -> {done, total}
      recentProjectIds.forEach(id => { totals[id] = { done: 0, total: 0 }; });
      allRows.forEach(r => {
        const projId = allSectionToProject[r.section_id];
        if (!totals[projId]) return;
        totals[projId].total++;
        if (allCheckedRowIds.has(r.id)) totals[projId].done++;
      });

      recent.forEach((p, idx) => {
        const colors = getColorForSubcategory(p.subcategory_id);
        const t = totals[p.id];
        const pct = t.total ? Math.round((t.done / t.total) * 100) : 0;

        const item = document.createElement('div');
        item.style.cssText = 'display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;' +
          (idx < recent.length - 1 ? ' border-bottom:1.5px solid var(--border);' : '');
        item.addEventListener('click', () => openProject(p.id, p.name));

        const photoUrl = photoMap[p.id];
        if (photoUrl) {
          const img = document.createElement('img');
          img.src = photoUrl;
          img.style.cssText = 'width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0;';
          item.appendChild(img);
        } else {
          item.appendChild(yarnCircleEl(colors.main, 40, getCategoryIcon(p.subcategory_id), 17));
        }

        const info = document.createElement('div');
        info.style.cssText = 'flex:1; min-width:0;';
        info.innerHTML = `
          <div style="font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
          <div style="font-size:11px; color:var(--text-secondary); margin-top:1px;">${getCategoryName(p.subcategory_id) || ''}</div>
        `;
        item.appendChild(info);

        if (t.total > 0) {
          const progWrap = document.createElement('div');
          progWrap.style.cssText = 'text-align:right; flex-shrink:0;';
          progWrap.innerHTML = `
            <div style="font-size:12px; font-weight:700; color:${colors.main};">${pct}%</div>
            <div style="width:48px; height:4px; background:var(--done-bg); border-radius:4px; margin-top:4px; overflow:hidden;">
              <div style="height:100%; width:${pct}%; background:${colors.main}; border-radius:4px;"></div>
            </div>
          `;
          item.appendChild(progWrap);
        }

        recentProjectsListEl.appendChild(item);
      });

      recentProjectsBlockEl.style.display = 'block';
    }

    // ---------- Карточка проекта (переиспользуется в поиске и списке по подкатегории) ----------
    function createProjectItemEl(p) {
      const colors = getColorForSubcategory(p.subcategory_id);
      const card = document.createElement('div');
      card.className = 'cat-card';

      const photoUrl = photoMap[p.id];
      if (photoUrl) {
        const img = document.createElement('img');
        img.className = 'project-card-img';
        img.src = photoUrl;
        img.alt = p.name;
        card.appendChild(img);
      } else {
        const iconArea = document.createElement('div');
        iconArea.className = 'cat-card-icon-area';
        iconArea.style.background = colors.light;
        iconArea.appendChild(yarnCircleEl(colors.main, 64, getCategoryIcon(p.subcategory_id), 27));
        card.appendChild(iconArea);
      }

      const name = document.createElement('div');
      name.className = 'cat-card-name';
      name.style.marginTop = '10px';
      name.textContent = p.name;
      card.appendChild(name);

      const badges = document.createElement('div');
      badges.className = 'project-badges';

      const subcatName = getCategoryName(p.subcategory_id);
      if (subcatName) {
        const catBadge = document.createElement('span');
        catBadge.className = 'badge-cat';
        catBadge.style.background = colors.light;
        catBadge.style.color = colors.main;
        catBadge.textContent = subcatName;
        badges.appendChild(catBadge);
      }

      (p.project_tags || []).forEach(pt => {
        if (!pt.tags?.name) return;
        const tagBadge = document.createElement('span');
        tagBadge.className = 'badge-tag';
        tagBadge.textContent = pt.tags.name;
        badges.appendChild(tagBadge);
      });

      if (badges.children.length) card.appendChild(badges);

      card.addEventListener('click', () => openProject(p.id, p.name));
      return card;
    }

    function emptyMessage(text) {
      const empty = document.createElement('p');
      empty.style.color = 'var(--text-secondary)';
      empty.style.fontSize = '13px';
      empty.style.gridColumn = '1 / -1';
      empty.textContent = text;
      return empty;
    }

    // ---------- Уровень 1: Категории ----------
    function renderCategoryGrid() {
      categoryGridEl.innerHTML = '';
      const topLevel = allCategories.filter(c => !c.parent_id);
      topLevel.forEach(cat => {
        const colors = getColorForCategoryName(cat.name);
        const card = document.createElement('div');
        card.className = 'cat-card';

        const iconArea = document.createElement('div');
        iconArea.className = 'cat-card-icon-area';
        iconArea.style.background = colors.light;
        iconArea.appendChild(yarnCircleEl(colors.main, 64, cat.icon || '🧶', 27));
        card.appendChild(iconArea);

        const name = document.createElement('div');
        name.className = 'cat-card-name';
        name.textContent = cat.name;
        card.appendChild(name);

        card.addEventListener('click', () => openCategory(cat));
        categoryGridEl.appendChild(card);
      });
    }

    function openCategory(cat) {
      currentCategoryId = cat.id;
      const subcats = allCategories.filter(c => c.parent_id === cat.id);

      if (subcats.length === 1) {
        // Единственная подкатегория — сразу переходим к проектам, минуя лишний шаг
        openSubcategory(subcats[0]);
        return;
      }

      const colors = getColorForCategoryName(cat.name);
      renderAppHeader(colors.main, (cat.icon || '🧶') + ' ' + cat.name, 'Выбери раздел', () => {
        document.getElementById('back-to-categories-btn').click();
      });

      categoryTitleEl.textContent = cat.name;
      subcategoryGridEl.innerHTML = '';
      subcats.forEach(sc => {
        const card = document.createElement('div');
        card.className = 'cat-card';

        const iconArea = document.createElement('div');
        iconArea.className = 'cat-card-icon-area';
        iconArea.style.height = '80px';
        iconArea.style.background = colors.light;
        iconArea.appendChild(yarnCircleEl(colors.main, 52, sc.icon || cat.icon || '🧶', 22));
        card.appendChild(iconArea);

        const name = document.createElement('div');
        name.className = 'cat-card-name';
        name.style.fontSize = '13px';
        name.textContent = sc.name;
        card.appendChild(name);

        card.addEventListener('click', () => openSubcategory(sc));
        subcategoryGridEl.appendChild(card);
      });

      viewCategories.style.display = 'none';
      viewSubcategories.style.display = 'block';
    }

    document.getElementById('back-to-categories-btn').addEventListener('click', () => {
      currentCategoryId = null;
      viewSubcategories.style.display = 'none';
      viewCategories.style.display = 'block';
      renderAppHeader('#A8536A', '🧶 Крючок и клубок', null, null);
    });

    // ---------- Уровень 2: Подкатегории → проекты ----------
    function openSubcategory(subcat) {
      currentSubcategoryId = subcat.id;
      currentCategoryId = subcat.parent_id;
      const parentCat = allCategories.find(c => c.id === subcat.parent_id);
      const colors = getColorForSubcategory(subcat.id);

      subcategoryTitleEl.textContent = subcat.name;
      backToSubcatLabelEl.textContent = parentCat ? parentCat.name : 'Категории';

      renderAppHeader(colors.main, (subcat.icon || '🧶') + ' ' + subcat.name, parentCat ? parentCat.name : '', () => {
        document.getElementById('back-to-subcategories-btn').click();
      });

      viewCategories.style.display = 'none';
      viewSubcategories.style.display = 'none';
      viewProjects.style.display = 'block';

      renderSubcategoryProjects();
    }

    function renderSubcategoryProjects() {
      projectListEl.innerHTML = '';
      const filtered = projectsCache.filter(p => p.subcategory_id === currentSubcategoryId);
      if (!filtered.length) {
        projectListEl.appendChild(emptyMessage('Пока нет проектов в этой подкатегории'));
        return;
      }
      filtered.forEach(p => projectListEl.appendChild(createProjectItemEl(p)));
    }

    // Обновляет тот список, который сейчас реально виден пользователю
    // (нужна, т.к. "+ Новый проект" теперь доступна с трёх разных экранов)
    function refreshCurrentListView() {
      if (viewProjects.style.display === 'block') {
        renderSubcategoryProjects();
      } else if (viewCategories.style.display === 'block') {
        renderSearchResults(searchInput.value.trim().toLowerCase());
      }
      // на экране подкатегорий (view-subcategories) обновлять нечего — там нет списка проектов
    }

    document.getElementById('back-to-subcategories-btn').addEventListener('click', () => {
      currentSubcategoryId = null;
      viewProjects.style.display = 'none';

      const parentCat = allCategories.find(c => c.id === currentCategoryId);
      const siblingSubcats = parentCat ? allCategories.filter(c => c.parent_id === parentCat.id) : [];

      if (parentCat && siblingSubcats.length > 1) {
        viewSubcategories.style.display = 'block';
        const colors = getColorForCategoryName(parentCat.name);
        renderAppHeader(colors.main, (parentCat.icon || '🧶') + ' ' + parentCat.name, 'Выбери раздел', () => {
          document.getElementById('back-to-categories-btn').click();
        });
      } else {
        // если у категории была всего 1 подкатегория (мы её пропускали) — возвращаемся сразу к категориям
        currentCategoryId = null;
        viewCategories.style.display = 'block';
        renderAppHeader('#A8536A', '🧶 Крючок и клубок', null, null);
      }
    });

    // ---------- Глобальный поиск (на главном экране, по всем категориям) ----------
    function renderSearchResults(filterText) {
      if (!filterText) {
        searchResultsEl.innerHTML = '';
        categoryGridEl.style.display = 'grid';
        categoryGridTitleEl.style.display = '';
        if (projectsCache.length) recentProjectsBlockEl.style.display = 'block';
        return;
      }
      categoryGridEl.style.display = 'none';
      categoryGridTitleEl.style.display = 'none';
      recentProjectsBlockEl.style.display = 'none';
      searchResultsEl.innerHTML = '';

      const filtered = projectsCache.filter(p => {
        const tagNames = (p.project_tags || []).map(pt => pt.tags?.name?.toLowerCase() || '');
        return p.name.toLowerCase().includes(filterText) || tagNames.some(t => t.includes(filterText));
      });

      if (!filtered.length) {
        searchResultsEl.appendChild(emptyMessage('Ничего не найдено'));
        return;
      }
      filtered.forEach(p => searchResultsEl.appendChild(createProjectItemEl(p)));
    }

    searchInput.addEventListener('input', () => {
      renderSearchResults(searchInput.value.trim().toLowerCase());
    });

    document.getElementById('add-project-btn').addEventListener('click', () => {
      projectFormHolder.innerHTML = '';
      projectFormHolder.appendChild(buildProjectForm({ presetSubcategoryId: currentSubcategoryId }));
    });

    const projectFormHolderHome = document.getElementById('project-form-holder-home');
    document.getElementById('add-project-home-btn').addEventListener('click', () => {
      projectFormHolderHome.innerHTML = '';
      projectFormHolderHome.appendChild(buildProjectForm());
    });

    const projectFormHolderCategory = document.getElementById('project-form-holder-category');
    document.getElementById('add-project-category-btn').addEventListener('click', () => {
      projectFormHolderCategory.innerHTML = '';
      projectFormHolderCategory.appendChild(buildProjectForm({ presetCategoryId: currentCategoryId }));
    });

    function buildProjectForm(opts) {
      opts = opts || {};
      const isEdit = opts.mode === 'edit';
      const project = opts.project || null;
      const existingTagIds = opts.existingTagIds || new Set();

      const form = document.createElement('div');
      form.className = 'inline-form';

      // Название
      const nameLabel = document.createElement('label');
      nameLabel.textContent = 'Название проекта';
      form.appendChild(nameLabel);
      const nameInput = document.createElement('input');
      nameInput.placeholder = 'Например: Тыква-брелок';
      if (isEdit) nameInput.value = project.name;
      form.appendChild(nameInput);

      // Категория
      const catLabel = document.createElement('label');
      catLabel.textContent = 'Категория';
      form.appendChild(catLabel);
      const catSelect = document.createElement('select');
      catSelect.className = 'form-select';
      form.appendChild(catSelect);

      function refreshCatOptions(selectedValue) {
        catSelect.innerHTML = '';
        const catPlaceholder = document.createElement('option');
        catPlaceholder.textContent = 'Выберите категорию';
        catPlaceholder.value = '';
        catSelect.appendChild(catPlaceholder);
        allCategories.filter(c => !c.parent_id).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          catSelect.appendChild(opt);
        });
        const newOpt = document.createElement('option');
        newOpt.value = '__new_category__';
        newOpt.textContent = '+ Новая категория...';
        catSelect.appendChild(newOpt);
        if (selectedValue) catSelect.value = selectedValue;
      }
      refreshCatOptions();

      // Мини-форма создания новой категории
      const newCatForm = document.createElement('div');
      newCatForm.className = 'inline-form';
      newCatForm.style.display = 'none';
      newCatForm.style.marginTop = '8px';
      const newCatNameLabel = document.createElement('label');
      newCatNameLabel.textContent = 'Название новой категории';
      newCatForm.appendChild(newCatNameLabel);
      const newCatNameInput = document.createElement('input');
      newCatNameInput.placeholder = 'Например: Для питомцев';
      newCatForm.appendChild(newCatNameInput);
      const newCatIconLabel = document.createElement('label');
      newCatIconLabel.textContent = 'Иконка-эмодзи (необязательно)';
      newCatForm.appendChild(newCatIconLabel);
      const newCatIconInput = document.createElement('input');
      newCatIconInput.placeholder = '🐾';
      newCatForm.appendChild(newCatIconInput);
      const newCatActions = document.createElement('div');
      newCatActions.className = 'form-actions';
      const newCatSaveBtn = document.createElement('button');
      newCatSaveBtn.textContent = 'Создать категорию';
      const newCatCancelBtn = document.createElement('button');
      newCatCancelBtn.className = 'secondary';
      newCatCancelBtn.textContent = 'Отмена';
      newCatActions.appendChild(newCatSaveBtn);
      newCatActions.appendChild(newCatCancelBtn);
      newCatForm.appendChild(newCatActions);
      form.appendChild(newCatForm);

      newCatCancelBtn.addEventListener('click', () => {
        newCatForm.style.display = 'none';
        refreshCatOptions('');
      });

      newCatSaveBtn.addEventListener('click', async () => {
        const catName = newCatNameInput.value.trim();
        if (!catName) { showToast('Введите название категории'); return; }
        const icon = newCatIconInput.value.trim() || null;
        const { data, error } = await sb.from('categories').insert({ name: catName, icon }).select().single();
        if (error) { showToast('Ошибка: ' + error.message); return; }
        allCategories.push(data);
        newCatForm.style.display = 'none';
        newCatNameInput.value = '';
        newCatIconInput.value = '';
        refreshCatOptions(data.id);
        catSelect.dispatchEvent(new Event('change'));
      });

      // Подкатегория
      const subcatWrap = document.createElement('div');
      const subcatLabel = document.createElement('label');
      subcatLabel.textContent = 'Подкатегория';
      subcatWrap.appendChild(subcatLabel);
      const subcatSelect = document.createElement('select');
      subcatSelect.className = 'form-select';
      subcatSelect.disabled = true;
      const subcatPlaceholder = document.createElement('option');
      subcatPlaceholder.textContent = 'Сначала выберите категорию';
      subcatPlaceholder.value = '';
      subcatSelect.appendChild(subcatPlaceholder);
      subcatWrap.appendChild(subcatSelect);
      form.appendChild(subcatWrap);

      // Мини-форма создания новой подкатегории
      const newSubcatForm = document.createElement('div');
      newSubcatForm.className = 'inline-form';
      newSubcatForm.style.display = 'none';
      newSubcatForm.style.marginTop = '8px';
      const newSubcatNameLabel = document.createElement('label');
      newSubcatNameLabel.textContent = 'Название новой подкатегории';
      newSubcatForm.appendChild(newSubcatNameLabel);
      const newSubcatNameInput = document.createElement('input');
      newSubcatNameInput.placeholder = 'Например: Варежки';
      newSubcatForm.appendChild(newSubcatNameInput);
      const newSubcatIconLabel = document.createElement('label');
      newSubcatIconLabel.textContent = 'Иконка-эмодзи (необязательно)';
      newSubcatForm.appendChild(newSubcatIconLabel);
      const newSubcatIconInput = document.createElement('input');
      newSubcatIconInput.placeholder = '🧤';
      newSubcatForm.appendChild(newSubcatIconInput);
      const newSubcatActions = document.createElement('div');
      newSubcatActions.className = 'form-actions';
      const newSubcatSaveBtn = document.createElement('button');
      newSubcatSaveBtn.textContent = 'Создать подкатегорию';
      const newSubcatCancelBtn = document.createElement('button');
      newSubcatCancelBtn.className = 'secondary';
      newSubcatCancelBtn.textContent = 'Отмена';
      newSubcatActions.appendChild(newSubcatSaveBtn);
      newSubcatActions.appendChild(newSubcatCancelBtn);
      newSubcatForm.appendChild(newSubcatActions);
      form.appendChild(newSubcatForm);

      newSubcatCancelBtn.addEventListener('click', () => {
        newSubcatForm.style.display = 'none';
        catSelect.dispatchEvent(new Event('change'));
      });

      newSubcatSaveBtn.addEventListener('click', async () => {
        const subcatName = newSubcatNameInput.value.trim();
        if (!subcatName) { showToast('Введите название подкатегории'); return; }
        if (!catSelect.value || catSelect.value === '__new_category__') { showToast('Сначала выберите категорию'); return; }
        const icon = newSubcatIconInput.value.trim() || null;
        const { data, error } = await sb.from('categories').insert({
          name: subcatName,
          icon,
          parent_id: catSelect.value
        }).select().single();
        if (error) { showToast('Ошибка: ' + error.message); return; }
        allCategories.push(data);
        newSubcatForm.style.display = 'none';
        newSubcatNameInput.value = '';
        newSubcatIconInput.value = '';
        catSelect.dispatchEvent(new Event('change'));
        // после перерисовки списка подкатегорий сразу выбираем только что созданную
        subcatSelect.value = data.id;
      });

      catSelect.addEventListener('change', () => {
        if (catSelect.value === '__new_category__') {
          newCatForm.style.display = 'block';
          subcatWrap.style.display = 'none';
          newSubcatForm.style.display = 'none';
          return;
        }
        newCatForm.style.display = 'none';

        subcatSelect.innerHTML = '';
        const subcats = allCategories.filter(c => c.parent_id === catSelect.value);

        if (!catSelect.value) {
          subcatWrap.style.display = '';
          newSubcatForm.style.display = 'none';
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Сначала выберите категорию';
          subcatSelect.appendChild(opt);
          subcatSelect.disabled = true;
          return;
        }

        if (subcats.length === 1) {
          // Единственная подкатегория — выбираем автоматически, шаг не показываем
          subcatSelect.innerHTML = '';
          const opt = document.createElement('option');
          opt.value = subcats[0].id;
          opt.textContent = subcats[0].name;
          subcatSelect.appendChild(opt);
          subcatSelect.value = subcats[0].id;
          subcatWrap.style.display = 'none';
          newSubcatForm.style.display = 'none';
          return;
        }

        subcatWrap.style.display = '';
        subcatSelect.disabled = false;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = subcats.length ? 'Выберите подкатегорию' : 'Подкатегорий пока нет';
        subcatSelect.appendChild(placeholder);
        subcats.forEach(sc => {
          const opt = document.createElement('option');
          opt.value = sc.id;
          opt.textContent = sc.name;
          subcatSelect.appendChild(opt);
        });
        const newSubcatOpt = document.createElement('option');
        newSubcatOpt.value = '__new_subcategory__';
        newSubcatOpt.textContent = '+ Новая подкатегория...';
        subcatSelect.appendChild(newSubcatOpt);

        if (isEdit && project.subcategory_id && subcats.some(sc => sc.id === project.subcategory_id)) {
          subcatSelect.value = project.subcategory_id;
        }
        if (!isEdit && opts.presetSubcategoryId && subcats.some(sc => sc.id === opts.presetSubcategoryId)) {
          subcatSelect.value = opts.presetSubcategoryId;
        }
      });

      subcatSelect.addEventListener('change', () => {
        if (subcatSelect.value === '__new_subcategory__') {
          newSubcatForm.style.display = 'block';
        } else {
          newSubcatForm.style.display = 'none';
        }
      });

      // Предзаполнение в режиме редактирования
      if (isEdit && project.subcategory_id) {
        const currentSubcat = allCategories.find(c => c.id === project.subcategory_id);
        const parentId = currentSubcat ? currentSubcat.parent_id : null;
        if (parentId) {
          catSelect.value = parentId;
          catSelect.dispatchEvent(new Event('change'));
        }
      }

      // Предзаполнение при создании из конкретной подкатегории
      if (!isEdit && opts.presetSubcategoryId) {
        const presetSubcat = allCategories.find(c => c.id === opts.presetSubcategoryId);
        if (presetSubcat && presetSubcat.parent_id) {
          catSelect.value = presetSubcat.parent_id;
          catSelect.dispatchEvent(new Event('change'));
        }
      }

      // Предзаполнение при создании из конкретной категории (без подкатегории)
      if (!isEdit && !opts.presetSubcategoryId && opts.presetCategoryId) {
        catSelect.value = opts.presetCategoryId;
        catSelect.dispatchEvent(new Event('change'));
      }

      // Теги
      const tagsLabel = document.createElement('label');
      tagsLabel.textContent = 'Теги (необязательно)';
      form.appendChild(tagsLabel);
      const tagPicker = document.createElement('div');
      tagPicker.className = 'tag-picker';
      const selectedTagIds = new Set(isEdit ? existingTagIds : []);

      function renderTagPills() {
        tagPicker.innerHTML = '';
        allTags.forEach(t => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill' + (selectedTagIds.has(t.id) ? ' selected' : '');
          pill.textContent = t.name;
          pill.addEventListener('click', () => {
            if (selectedTagIds.has(t.id)) selectedTagIds.delete(t.id);
            else selectedTagIds.add(t.id);
            renderTagPills();
          });
          tagPicker.appendChild(pill);
        });
      }
      renderTagPills();
      form.appendChild(tagPicker);

      const newTagRow = document.createElement('div');
      newTagRow.className = 'new-tag-row';
      const newTagInput = document.createElement('input');
      newTagInput.placeholder = 'Новый тег...';
      const newTagBtn = document.createElement('button');
      newTagBtn.className = 'secondary';
      newTagBtn.textContent = 'Добавить тег';
      newTagRow.appendChild(newTagInput);
      newTagRow.appendChild(newTagBtn);
      form.appendChild(newTagRow);

      newTagBtn.addEventListener('click', async () => {
        const tagName = newTagInput.value.trim();
        if (!tagName) return;
        const { data, error } = await sb.from('tags').insert({ name: tagName }).select().single();
        if (error) { showToast('Ошибка: ' + error.message); return; }
        allTags.push(data);
        selectedTagIds.add(data.id);
        renderTagPills();
        newTagInput.value = '';
      });

      // Кнопки
      const actions = document.createElement('div');
      actions.className = 'form-actions';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = isEdit ? 'Сохранить' : 'Создать проект';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      form.appendChild(actions);

      cancelBtn.addEventListener('click', () => form.remove());

      saveBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        if (!name) { showToast('Введите название'); return; }
        if (catSelect.value === '__new_category__') { showToast('Сначала создайте категорию (кнопка "Создать категорию")'); return; }
        if (!subcatSelect.value || subcatSelect.value === '__new_subcategory__') {
          showToast(subcatSelect.value === '__new_subcategory__'
            ? 'Сначала создайте подкатегорию (кнопка "Создать подкатегорию")'
            : 'Выберите подкатегорию');
          return;
        }

        saveBtn.disabled = true;

        const projectId = isEdit ? project.id : null;

        if (isEdit) {
          const { error } = await sb
            .from('projects')
            .update({ name, subcategory_id: subcatSelect.value })
            .eq('id', projectId);
          if (error) { showToast('Ошибка: ' + error.message); saveBtn.disabled = false; return; }

          // пересобираем список тегов проекта: удаляем старые связи, вставляем новые
          await sb.from('project_tags').delete().eq('project_id', projectId);
          if (selectedTagIds.size) {
            const rows = Array.from(selectedTagIds).map(tagId => ({ project_id: projectId, tag_id: tagId }));
            const { error: tagError } = await sb.from('project_tags').insert(rows);
            if (tagError) showToast('Проект сохранён, но теги не обновились: ' + tagError.message);
          }

          form.remove();
          projectTitleEl.textContent = name;
          loadProjects();
        } else {
          const { data: newProject, error } = await sb
            .from('projects')
            .insert({ name, subcategory_id: subcatSelect.value })
            .select()
            .single();

          if (error) { showToast('Ошибка: ' + error.message); saveBtn.disabled = false; return; }

          if (selectedTagIds.size) {
            const rows = Array.from(selectedTagIds).map(tagId => ({ project_id: newProject.id, tag_id: tagId }));
            const { error: tagError } = await sb.from('project_tags').insert(rows);
            if (tagError) showToast('Проект создан, но теги не сохранились: ' + tagError.message);
          }

          form.remove();
          await loadProjects();
          await openProject(newProject.id, newProject.name);
        }
      });

      return form;
    }

    // ---------- Открытие проекта ----------
    let previousViewEl = null;

    function hideAllTopViews() {
      viewCategories.style.display = 'none';
      viewSubcategories.style.display = 'none';
      viewProjects.style.display = 'none';
      viewProject.style.display = 'none';
    }

    function currentVisibleTopView() {
      if (viewProjects.style.display === 'block') return viewProjects;
      if (viewSubcategories.style.display === 'block') return viewSubcategories;
      return viewCategories;
    }

    async function returnToPreviousView() {
      hideAllTopViews();
      await loadProjects();
      await loadPhotoMap();
      if (previousViewEl === viewProjects) {
        viewProjects.style.display = 'block';
        const subcat = allCategories.find(c => c.id === currentSubcategoryId);
        if (subcat) {
          const colors = getColorForSubcategory(subcat.id);
          const parentCat = allCategories.find(c => c.id === subcat.parent_id);
          renderAppHeader(colors.main, (subcat.icon || '🧶') + ' ' + subcat.name, parentCat ? parentCat.name : '', () => {
            document.getElementById('back-to-subcategories-btn').click();
          });
        }
        renderSubcategoryProjects();
      } else if (previousViewEl === viewSubcategories) {
        viewSubcategories.style.display = 'block';
        const cat = allCategories.find(c => c.id === currentCategoryId);
        if (cat) {
          const colors = getColorForCategoryName(cat.name);
          renderAppHeader(colors.main, (cat.icon || '🧶') + ' ' + cat.name, 'Выбери раздел', () => {
            document.getElementById('back-to-categories-btn').click();
          });
        }
      } else {
        viewCategories.style.display = 'block';
        renderAppHeader('#A8536A', '🧶 Крючок и клубок', null, null);
        renderCategoryGrid();
        await renderRecentProjects();
        renderSearchResults(searchInput.value.trim().toLowerCase());
      }
    }

    async function openProject(id, name) {
      previousViewEl = currentVisibleTopView();
      currentProjectId = id;
      projectTitleEl.textContent = name;

      const cached = projectsCache.find(p => p.id === id);
      const colors = cached ? getColorForSubcategory(cached.subcategory_id) : FALLBACK_COLOR;
      renderAppHeader(colors.main, name, null, () => {
        document.getElementById('back-btn').click();
      });

      hideAllTopViews();
      viewProject.style.display = 'block';
      sectionFormHolder.innerHTML = '';
      await loadProjectPhotos();
      await loadSections();
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      currentProjectId = null;
      returnToPreviousView();
    });

    const projectEditFormHolder = document.getElementById('project-edit-form-holder');

    document.getElementById('edit-project-btn').addEventListener('click', async () => {
      const { data: project, error } = await sb.from('projects').select('*').eq('id', currentProjectId).single();
      if (error) { showToast('Ошибка: ' + error.message); return; }

      const { data: existingTags } = await sb.from('project_tags').select('tag_id').eq('project_id', currentProjectId);
      const existingTagIds = new Set((existingTags || []).map(t => t.tag_id));

      projectEditFormHolder.innerHTML = '';
      projectEditFormHolder.appendChild(buildProjectForm({ mode: 'edit', project, existingTagIds }));
    });

    document.getElementById('delete-project-btn').addEventListener('click', () => {
      showConfirmModal({
        title: 'Удалить проект?',
        message: 'Проект "' + projectTitleEl.textContent + '" со всеми деталями, рядами и фото будет удалён без возможности восстановить.',
        requireWord: 'Удалить',
        onConfirm: async () => {
          const { error } = await sb.from('projects').delete().eq('id', currentProjectId);
          if (error) { showToast('Ошибка: ' + error.message); return; }
          currentProjectId = null;
          await returnToPreviousView();
        }
      });
    });

    // ---------- Детали (sections) ----------
    async function loadSections() {
      const { data: sections, error } = await sb
        .from('sections')
        .select('*')
        .eq('project_id', currentProjectId)
        .order('position', { ascending: true });
      if (error) { showToast('Ошибка: ' + error.message); return; }

      // Личное состояние "свёрнуто/развёрнуто" по деталям (своё для каждого пользователя)
      const sectionIds = sections.map(s => s.id);
      let collapseState = {}; // section_id -> collapsed (true/false)
      if (sectionIds.length) {
        const { data: stateRows } = await sb
          .from('section_collapse_state')
          .select('section_id, collapsed')
          .eq('telegram_user_id', currentUserId)
          .in('section_id', sectionIds);
        (stateRows || []).forEach(s => { collapseState[s.section_id] = s.collapsed; });
      }

      sectionListEl.innerHTML = '';
      let sectionIndex = 0;
      for (const sec of sections) {
        const isFirstSection = sectionIndex === 0;
        sectionIndex++;

        const block = document.createElement('div');
        block.className = 'section-block';

        const header = document.createElement('div');
        header.className = 'sec-header';

        const toggleArea = document.createElement('div');
        toggleArea.style.cssText = 'display:flex; align-items:center; gap:8px; flex:1; min-width:0; cursor:pointer;';

        const badge = document.createElement('div');
        badge.className = 'part-badge';
        badge.style.background = 'var(--done-bg)';
        badge.style.color = 'var(--text-secondary)';
        badge.textContent = '…';
        toggleArea.appendChild(badge);

        const title = document.createElement('h2');
        title.style.flex = '1';
        title.textContent = sec.title;
        toggleArea.appendChild(title);

        const chevron = document.createElement('span');
        chevron.textContent = '⌄';
        chevron.style.cssText = 'font-size:16px; color:var(--text-secondary); transition:transform .2s; flex-shrink:0;';
        toggleArea.appendChild(chevron);

        header.appendChild(toggleArea);

        const secEditBtn = document.createElement('button');
        secEditBtn.className = 'icon-btn';
        secEditBtn.textContent = '✎';
        secEditBtn.title = 'Редактировать деталь';
        header.appendChild(secEditBtn);

        const secDelBtn = document.createElement('button');
        secDelBtn.className = 'icon-btn';
        secDelBtn.textContent = '🗑';
        secDelBtn.title = 'Удалить деталь';
        header.appendChild(secDelBtn);

        block.appendChild(header);

        const metaEl = document.createElement('div');
        metaEl.className = 'sec-meta';
        if (sec.meta) metaEl.textContent = sec.meta;
        if (sec.meta) block.appendChild(metaEl);

        const secEditFormHolder = document.createElement('div');
        block.appendChild(secEditFormHolder);

        secEditBtn.addEventListener('click', () => {
          secEditFormHolder.innerHTML = '';
          const form = buildForm(
            [
              { name: 'title', label: 'Название детали', placeholder: 'Например: Голова' },
              { name: 'meta', label: 'Примечание (необязательно)', placeholder: 'Например: нить А, набивать по ходу' }
            ],
            async (values, formEl) => {
              if (!values.title) { showToast('Введите название детали'); return; }
              const { error } = await sb.from('sections').update({
                title: values.title,
                meta: values.meta || null
              }).eq('id', sec.id);
              if (error) { showToast('Ошибка: ' + error.message); return; }
              formEl.remove();
              loadSections();
            },
            'Сохранить'
          );
          // предзаполняем текущими значениями
          const inputs = form.querySelectorAll('input');
          inputs[0].value = sec.title;
          inputs[1].value = sec.meta || '';
          secEditFormHolder.appendChild(form);
        });

        secDelBtn.addEventListener('click', () => {
          showConfirmModal({
            title: 'Удалить деталь?',
            message: 'Деталь "' + sec.title + '" и все её ряды будут удалены без возможности восстановить.',
            requireWord: 'Удалить',
            onConfirm: async () => {
              const { error } = await sb.from('sections').delete().eq('id', sec.id);
              if (error) { showToast('Ошибка: ' + error.message); return; }
              loadSections();
            }
          });
        });

        // ---------- Сворачиваемое тело детали (ряды + форма добавления) ----------
        const partBody = document.createElement('div');

        const rowsWrap = document.createElement('div');
        partBody.appendChild(rowsWrap);

        const rowFormHolder = document.createElement('div');
        partBody.appendChild(rowFormHolder);

        const addRowBtn = document.createElement('button');
        addRowBtn.className = 'secondary';
        addRowBtn.textContent = '+ Добавить ряд';
        addRowBtn.addEventListener('click', () => {
          rowFormHolder.innerHTML = '';
          const form = buildForm(
            [
              { name: 'description', label: 'Описание ряда', placeholder: 'Например: ВК, 6 сбн' },
              { name: 'total', label: 'Итого петель в ряду (необязательно)', type: 'number', placeholder: 'Например: 6' },
              { name: 'note', label: 'Примечание (необязательно)', type: 'textarea', placeholder: 'Например: вставить глазки' }
            ],
            async (values, formEl) => {
              if (!values.description) { showToast('Введите описание ряда'); return; }
              await addRow(sec.id, rowsWrap, values);
              formEl.remove();
            },
            'Добавить ряд'
          );
          rowFormHolder.appendChild(form);
        });
        partBody.appendChild(addRowBtn);

        block.appendChild(partBody);

        // Состояние сворачивания: берём то, что пользователь сохранил в прошлый раз;
        // если для этой детали ещё ничего не сохранено — по умолчанию первая открыта, остальные свёрнуты
        const savedCollapsed = collapseState.hasOwnProperty(sec.id) ? collapseState[sec.id] : !isFirstSection;
        if (savedCollapsed) {
          partBody.style.display = 'none';
          chevron.style.transform = 'rotate(-90deg)';
        }
        toggleArea.addEventListener('click', async () => {
          const willBeCollapsed = partBody.style.display !== 'none';
          partBody.style.display = willBeCollapsed ? 'none' : '';
          chevron.style.transform = willBeCollapsed ? 'rotate(-90deg)' : '';
          const { error } = await sb.from('section_collapse_state').upsert({
            section_id: sec.id,
            telegram_user_id: currentUserId,
            collapsed: willBeCollapsed
          });
          if (error) showToast('Ошибка сохранения: ' + error.message);
        });

        sectionListEl.appendChild(block);
        await loadRows(sec.id, rowsWrap, badge);
      }
    }

    document.getElementById('add-section-btn').addEventListener('click', () => {
      sectionFormHolder.innerHTML = '';
      const form = buildForm(
        [
          { name: 'title', label: 'Название детали', placeholder: 'Например: Голова' },
          { name: 'meta', label: 'Примечание (необязательно)', placeholder: 'Например: нить А, набивать по ходу' }
        ],
        async (values, formEl) => {
          if (!values.title) { showToast('Введите название детали'); return; }

          const { count } = await sb
            .from('sections')
            .select('*', { count: 'exact', head: true })
            .eq('project_id', currentProjectId);

          const { error } = await sb.from('sections').insert({
            project_id: currentProjectId,
            title: values.title,
            meta: values.meta || null,
            position: count || 0
          });
          if (error) { showToast('Ошибка: ' + error.message); return; }
          formEl.remove();
          loadSections();
        },
        'Добавить деталь'
      );
      sectionFormHolder.appendChild(form);
    });

    // ---------- Ряды (rows) ----------
    async function loadRows(sectionId, container, badgeEl) {
      badgeEl = badgeEl || container._badgeEl;
      container._badgeEl = badgeEl;

      const { data: rows, error } = await sb
        .from('rows')
        .select('*')
        .eq('section_id', sectionId)
        .order('position', { ascending: true });
      if (error) { showToast('Ошибка: ' + error.message); return; }

      const rowIds = rows.map(r => r.id);
      const checkedSet = await loadRowProgress(rowIds);

      function updateBadge() {
        if (!badgeEl) return;
        const doneCount = rowIds.filter(id => checkedSet.has(id)).length;
        const total = rowIds.length;
        const complete = total > 0 && doneCount === total;
        badgeEl.textContent = complete ? '✓' : String(total - doneCount);
        badgeEl.style.background = complete ? 'var(--accent)' : 'var(--accent-light)';
        badgeEl.style.color = complete ? 'white' : 'var(--accent)';
      }
      updateBadge();

      container.innerHTML = '';
      const checkboxRefs = []; // для каскадной отметки — все чекбоксы этой детали по порядку
      rows.forEach((r, idx) => {
        const isChecked = checkedSet.has(r.id);
        const item = document.createElement('div');
        item.className = 'row-item' + (isChecked ? ' done' : '');

        const num = document.createElement('div');
        num.className = 'row-num';
        num.textContent = r.row_number + '.';

        const textWrap = document.createElement('div');
        textWrap.style.flex = '1';

        const desc = document.createElement('div');
        desc.className = 'row-desc';
        desc.textContent = r.description + (r.total_stitches ? ' (' + r.total_stitches + ')' : '');
        textWrap.appendChild(desc);

        if (r.note) {
          const note = document.createElement('div');
          note.className = 'row-note';
          note.textContent = r.note;
          textWrap.appendChild(note);
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = isChecked;
        checkboxRefs.push({ checkbox, item, rowId: r.id });

        checkbox.addEventListener('change', async () => {
          if (checkbox.checked) {
            // отмечаем этот ряд и все НЕотмеченные ряды выше него в этой детали
            const toCheck = checkboxRefs.slice(0, idx + 1).filter(ref => !checkedSet.has(ref.rowId));
            toCheck.forEach(ref => {
              checkedSet.add(ref.rowId);
              ref.checkbox.checked = true;
              ref.item.classList.add('done');
            });
            if (toCheck.length) {
              const { error } = await sb.from('row_progress').upsert(
                toCheck.map(ref => ({ row_id: ref.rowId, telegram_user_id: currentUserId, checked: true }))
              );
              if (error) showToast('Ошибка сохранения: ' + error.message);
            }
          } else {
            // снимаем этот ряд и все ОТМЕЧЕННЫЕ ряды ниже него в этой детали
            const toUncheck = checkboxRefs.slice(idx).filter(ref => checkedSet.has(ref.rowId));
            toUncheck.forEach(ref => {
              checkedSet.delete(ref.rowId);
              ref.checkbox.checked = false;
              ref.item.classList.remove('done');
            });
            if (toUncheck.length) {
              const { error } = await sb.from('row_progress')
                .delete()
                .eq('telegram_user_id', currentUserId)
                .in('row_id', toUncheck.map(ref => ref.rowId));
              if (error) showToast('Ошибка сохранения: ' + error.message);
            }
          }
          updateBadge();
        });

        const rowActions = document.createElement('div');
        rowActions.className = 'row-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'icon-btn';
        editBtn.textContent = '✎';
        editBtn.title = 'Редактировать';
        editBtn.addEventListener('click', () => startEditRow(r, item, textWrap, sectionId, container));
        rowActions.appendChild(editBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn';
        delBtn.textContent = '🗑';
        delBtn.title = 'Удалить';
        delBtn.addEventListener('click', () => {
          showConfirmModal({
            title: 'Удалить ряд?',
            message: 'Ряд №' + r.row_number + ' будет удалён без возможности восстановить.',
            onConfirm: async () => {
              const { error } = await sb.from('rows').delete().eq('id', r.id);
              if (error) { showToast('Ошибка: ' + error.message); return; }
              loadRows(sectionId, container);
            }
          });
        });
        rowActions.appendChild(delBtn);

        item.appendChild(num);
        item.appendChild(textWrap);
        item.appendChild(checkbox);
        item.appendChild(rowActions);
        container.appendChild(item);
      });
    }

    function startEditRow(r, item, textWrap, sectionId, container) {
      const form = document.createElement('div');
      form.className = 'inline-form';

      const descLabel = document.createElement('label');
      descLabel.textContent = 'Описание ряда';
      form.appendChild(descLabel);
      const descInput = document.createElement('input');
      descInput.value = r.description;
      form.appendChild(descInput);

      const totalLabel = document.createElement('label');
      totalLabel.textContent = 'Итого петель (необязательно)';
      form.appendChild(totalLabel);
      const totalInput = document.createElement('input');
      totalInput.type = 'number';
      totalInput.value = r.total_stitches || '';
      form.appendChild(totalInput);

      const noteLabel = document.createElement('label');
      noteLabel.textContent = 'Примечание (необязательно)';
      form.appendChild(noteLabel);
      const noteInput = document.createElement('textarea');
      noteInput.value = r.note || '';
      form.appendChild(noteInput);

      const actions = document.createElement('div');
      actions.className = 'form-actions';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Сохранить';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      form.appendChild(actions);

      textWrap.style.display = 'none';
      item.insertBefore(form, textWrap);

      cancelBtn.addEventListener('click', () => {
        form.remove();
        textWrap.style.display = '';
      });

      saveBtn.addEventListener('click', async () => {
        const description = descInput.value.trim();
        if (!description) { showToast('Введите описание ряда'); return; }
        const { error } = await sb.from('rows').update({
          description,
          total_stitches: totalInput.value ? parseInt(totalInput.value, 10) : null,
          note: noteInput.value.trim() || null
        }).eq('id', r.id);
        if (error) { showToast('Ошибка: ' + error.message); return; }
        loadRows(sectionId, container);
      });
    }

    async function addRow(sectionId, container, values) {
      const { count } = await sb
        .from('rows')
        .select('*', { count: 'exact', head: true })
        .eq('section_id', sectionId);

      const nextNumber = (count || 0) + 1;

      const { error } = await sb.from('rows').insert({
        section_id: sectionId,
        row_number: nextNumber,
        description: values.description,
        note: values.note || null,
        total_stitches: values.total ? parseInt(values.total, 10) : null,
        position: count || 0
      });
      if (error) { showToast('Ошибка: ' + error.message); return; }
      loadRows(sectionId, container);
    }

    // ---------- Безопасное имя файла для Supabase Storage ----------
    // Storage не разрешает кириллицу, пробелы и некоторые символы в пути к файлу,
    // поэтому сохраняем оригинальное имя только как caption, а путь строим из безопасных символов
    function safeFileName(originalName) {
      const dotIndex = originalName.lastIndexOf('.');
      const ext = dotIndex > -1 ? originalName.slice(dotIndex + 1).toLowerCase().replace(/[^a-z0-9]/g, '') : '';
      return 'file' + (ext ? '.' + ext : '');
    }

    // ---------- Фото готовой работы ----------
    const photoInput = document.getElementById('photo-input');
    const photoGalleryEl = document.getElementById('photo-gallery');

    document.getElementById('upload-photo-btn').addEventListener('click', () => {
      photoInput.click();
    });

    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      if (!file) return;

      try {
        const filePath = currentProjectId + '/' + Date.now() + '_' + safeFileName(file.name);
        const { error: uploadError } = await sb.storage.from('photos').upload(filePath, file);
        if (uploadError) { showToast('Ошибка загрузки фото: ' + uploadError.message); return; }

        const { data: urlData } = sb.storage.from('photos').getPublicUrl(filePath);

        const { error: insertError } = await sb.from('photos').insert({
          project_id: currentProjectId,
          url: urlData.publicUrl
        });
        if (insertError) { showToast('Ошибка сохранения фото: ' + insertError.message); return; }

        showToast('Фото добавлено!');
        await loadProjectPhotos();
        await loadPhotoMap();

      } catch (err) {
        showToast('Ошибка: ' + err.message);
      } finally {
        photoInput.value = '';
      }
    });

    async function loadProjectPhotos() {
      const { data, error } = await sb
        .from('photos')
        .select('*')
        .eq('project_id', currentProjectId)
        .order('created_at', { ascending: false });
      if (error) { showToast('Ошибка загрузки фото: ' + error.message); return; }

      photoGalleryEl.innerHTML = '';
      (data || []).forEach(ph => {
        const img = document.createElement('img');
        img.src = ph.url;
        img.alt = 'Фото готовой работы';
        photoGalleryEl.appendChild(img);
      });
    }

    // ---------- Загрузка и разбор PDF ----------
    const pdfInput = document.getElementById('pdf-input');
    const pdfLoading = document.getElementById('pdf-loading');
    const pdfLoadingText = document.getElementById('pdf-loading-text');

    document.getElementById('upload-pdf-btn').addEventListener('click', () => {
      pdfInput.click();
    });

    pdfInput.addEventListener('change', async () => {
      const file = pdfInput.files[0];
      if (!file) return;

      pdfLoading.classList.add('active');
      pdfLoadingText.textContent = 'Загружаем файл в хранилище...';

      try {
        // --- 1. Загружаем PDF в Supabase Storage (лимит там намного больше, чем на Vercel) ---
        const filePath = currentProjectId + '/' + Date.now() + '_' + safeFileName(file.name);
        const { error: uploadError } = await sb.storage.from('schemas').upload(filePath, file);

        if (uploadError) {
          showToast('Ошибка загрузки файла: ' + uploadError.message);
          return;
        }

        const { data: urlData } = sb.storage.from('schemas').getPublicUrl(filePath);
        const pdfUrl = urlData.publicUrl;

        pdfLoadingText.textContent = 'Разбираем схему (это может занять несколько минут)...';

        const resp = await fetch('/api/parse-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pdfUrl })
        });

        const result = await resp.json();

        if (!resp.ok || result.error) {
          showToast('Ошибка: ' + (result.error || 'неизвестная ошибка'));
          return;
        }

        if (result.scanned) {
          showToast(result.message);
          return;
        }

        if (!result.sections || !result.sections.length) {
          showToast('Нейронка не смогла найти детали в этом файле');
          return;
        }

        pdfLoadingText.textContent = 'Сохраняем в базу...';
        await saveParsedSections(result.sections);

        if (result.coverImageBase64) {
          await saveCoverImage(result.coverImageBase64);
        }

        showToast('Готово! Добавлено деталей: ' + result.sections.length);
        await loadProjectPhotos();
        await loadPhotoMap();
        loadSections();

      } catch (err) {
        showToast('Ошибка: ' + err.message);
      } finally {
        pdfLoading.classList.remove('active');
        pdfInput.value = '';
      }
    });

    // ---------- Сохранение картинки-обложки, извлечённой из PDF ----------
    async function saveCoverImage(base64) {
      try {
        const byteChars = atob(base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'image/jpeg' });

        const filePath = currentProjectId + '/' + Date.now() + '_cover.jpg';
        const { error: uploadError } = await sb.storage.from('photos').upload(filePath, blob);
        if (uploadError) return; // не критично, просто не будет обложки

        const { data: urlData } = sb.storage.from('photos').getPublicUrl(filePath);
        await sb.from('photos').insert({
          project_id: currentProjectId,
          url: urlData.publicUrl,
          caption: 'Обложка из PDF'
        });
      } catch (e) {
        // тихо игнорируем — обложка не обязательна для работы приложения
      }
    }

    async function saveParsedSections(sections) {
      // узнаём, сколько деталей уже есть в проекте, чтобы продолжить нумерацию position
      const { count: existingSectionsCount } = await sb
        .from('sections')
        .select('*', { count: 'exact', head: true })
        .eq('project_id', currentProjectId);

      let sectionPosition = existingSectionsCount || 0;

      for (const sec of sections) {
        const { data: newSection, error: secError } = await sb
          .from('sections')
          .insert({
            project_id: currentProjectId,
            title: sec.title,
            meta: sec.meta || null,
            position: sectionPosition
          })
          .select()
          .single();

        if (secError) { showToast('Ошибка сохранения детали: ' + secError.message); continue; }
        sectionPosition++;

        const rowsToInsert = (sec.rows || []).map((r, idx) => ({
          section_id: newSection.id,
          row_number: idx + 1,
          description: r.description,
          note: r.note || null,
          total_stitches: r.total || null,
          position: idx
        }));

        if (rowsToInsert.length) {
          const { error: rowsError } = await sb.from('rows').insert(rowsToInsert);
          if (rowsError) showToast('Ошибка сохранения рядов: ' + rowsError.message);
        }
      }
    }

    // ---------- Старт ----------
    async function init() {
      renderAppHeader('#A8536A', '🧶 Крючок и клубок', null, null);
      await loadCategories();
      await loadTags();
      await loadPhotoMap();
      await loadProjects();
      renderCategoryGrid();
      await renderRecentProjects();
      viewCategories.style.display = 'block';
    }
    init();
  </script>
</body>
</html>
