<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крючок и клубок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* Светлый нейтральный фон, тёмные акцентные блоки и один ягодный акцент.
       Не подстраиваемся под тему Telegram (var(--tg-theme-*)) намеренно — у нас свой вид. */
    --bg:#F3F1EE; --card:#FFFFFF; --border:#E4DFD9;
    --ink:#1F1A24; --text:#1F1A24; --text-secondary:#6B6470; --on-dark-muted:#C9C2CE;
    --accent:#C2335A; --accent-hover:#A92A4E; --accent-light:#F8E1E7;
    --done-bg:#ECE8E3; --done-text:#9A929F;
    --radius-l:28px; --radius-m:20px; --radius-s:14px;
    --font-display:'Unbounded', 'Onest', sans-serif;
    --font-body:'Onest', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:var(--font-body);
    background:var(--bg); color:var(--text);
    padding:0 16px 132px; margin:0;
    -webkit-tap-highlight-color:transparent;
  }
  body.in-project{ padding-bottom:132px; }
  h1,h2{ margin:0; font-family:var(--font-display); font-weight:600; letter-spacing:-0.02em; }
  h2{ font-size:17px; }
  .section-title{ font-size:18px; margin:28px 0 12px; }
  #status{ color:var(--text-secondary); font-size:13px; margin:8px 0 0; }
  #status:empty{ display:none; }

  /* ---------- Кнопки ---------- */
  button{
    background:var(--accent); color:#fff; border:none;
    min-height:44px; padding:0 18px; border-radius:var(--radius-s);
    font-size:15px; margin:4px 4px 4px 0;
    cursor:pointer; font-family:var(--font-body); font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:background-color .15s ease, transform .1s ease;
  }
  button:active{ transform:scale(0.97); }
  button:hover{ background:var(--accent-hover); }
  button.secondary{ background:var(--card); color:var(--text); border:1px solid var(--border); }
  button.secondary:hover{ background:#FAF9F7; }
  button:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  button svg{ flex-shrink:0; }
  .wide-btn{ width:100%; margin:12px 0 0; }
  .back-btn{ display:none !important; }

  /* ---------- Шапка ---------- */
  .app-header{ display:flex; align-items:center; gap:12px; padding:20px 0 16px; }
  .app-logo{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .app-logo-text{ font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:-0.01em; }
  .round-btn{
    width:44px; height:44px; min-height:44px; border-radius:22px; padding:0; margin:0; flex-shrink:0;
    background:var(--card); color:var(--text); border:1px solid var(--border);
  }
  .round-btn:hover{ background:#FAF9F7; }
  .app-header-titles{ flex:1; min-width:0; }
  .app-header-title{
    font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:-0.02em;
    line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .app-header-sub{ font-size:13px; color:var(--text-secondary); margin-top:2px; }

  /* ---------- Поиск ---------- */
  .search-box{
    display:flex; align-items:center; gap:10px; height:52px; padding:0 16px;
    border-radius:18px; background:var(--card); margin:4px 0 0;
  }
  .search-box input{
    flex:1; min-width:0; border:0; outline:none; background:transparent;
    font-family:inherit; font-size:15px; color:var(--text);
  }

  /* ---------- Карточка «Сейчас вяжу» ---------- */
  .hero{
    background:var(--ink); color:#fff; border-radius:var(--radius-l); padding:20px;
    display:flex; flex-direction:column; gap:18px;
  }
  .hero-top{ display:flex; gap:16px; align-items:center; }
  .hero-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .hero-chip{
    align-self:flex-start; font-size:12px; font-weight:500; padding:4px 10px;
    border-radius:999px; background:rgba(255,255,255,0.12); color:#EDE8F0;
  }
  .hero-title{ font-family:var(--font-display); font-weight:600; font-size:24px; letter-spacing:-0.02em; line-height:1.15; overflow-wrap:anywhere; }
  .hero-sub{ font-size:14px; color:var(--on-dark-muted); }
  .hero-ring{ width:84px; height:84px; position:relative; flex-shrink:0; }
  .hero-ring-label{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .hero-ring-label b{ font-family:var(--font-display); font-weight:600; font-size:17px; }
  .hero-ring-label span{ font-size:10px; color:var(--on-dark-muted); }
  .hero-btn{ width:100%; min-height:52px; border-radius:18px; margin:0; font-size:16px; }
  .hero-empty{ display:flex; flex-direction:column; gap:10px; }
  .hero-empty p{ margin:0; color:var(--on-dark-muted); font-size:14px; line-height:1.4; }

  /* ---------- Недавние: горизонтальная лента ---------- */
  .recent-strip{ display:flex; gap:12px; overflow-x:auto; margin:0 -16px; padding:0 16px 4px; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .recent-strip::-webkit-scrollbar{ display:none; }
  .recent-card{
    width:150px; flex-shrink:0; background:var(--card); border-radius:24px; padding:8px 8px 14px;
    display:flex; flex-direction:column; gap:10px; cursor:pointer; scroll-snap-align:start;
  }
  .recent-card .cover{ height:120px; border-radius:18px; }
  .recent-card-body{ padding:0 6px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .recent-card-name{ font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recent-card-cat{ font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-progress{ display:flex; align-items:center; gap:8px; padding:0 6px; }
  .mini-progress .track{ flex:1; height:5px; border-radius:3px; background:var(--done-bg); overflow:hidden; }
  .mini-progress .fill{ height:100%; background:var(--ink); border-radius:3px; }
  .mini-progress span{ font-size:12px; font-weight:600; }

  /* ---------- Обложка-заглушка с вязаной текстурой ---------- */
  .cover{ background-size:28px 28px; background-position:center; overflow:hidden; display:block; width:100%; object-fit:cover; }

  /* ---------- Сетки категорий и проектов ---------- */
  .card-grid{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; margin-top:12px; }
  #search-results:empty{ display:none; }
  .cat-tile{
    min-height:128px; border-radius:24px; background:var(--card); color:var(--text); padding:16px;
    display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; gap:12px;
    cursor:pointer; text-align:left; transition:transform .1s ease;
  }
  .cat-tile:active{ transform:scale(0.98); }
  /* при наведении/нажатии плитка становится тёмной, а текст и иконка — светлыми (раньше общий
     стиль кнопок красил фон в ягодный, а текст оставался тёмным и серым — плохо читалось) */
  .cat-tile:hover, .cat-tile:focus-visible, .cat-tile:active{ background:var(--ink); color:#fff; }
  .cat-tile:hover .cat-tile-meta, .cat-tile:focus-visible .cat-tile-meta, .cat-tile:active .cat-tile-meta{ color:var(--on-dark-muted); }
  .recent-card:hover{ background:var(--card) !important; box-shadow:0 6px 18px rgba(31,26,36,0.10); }
  .cat-tile.dark{ background:var(--ink); color:#fff; }
  .cat-tile.dark .cat-tile-meta{ color:var(--on-dark-muted); }
  .cat-tile-emoji{ font-size:30px; line-height:1; }
  .cat-tile-name{ font-weight:600; font-size:16px; overflow-wrap:anywhere; }
  .cat-tile-meta{ font-size:12px; color:var(--text-secondary); margin-top:2px; }

  .proj-card{
    background:var(--card); border-radius:24px; padding:8px 8px 14px; cursor:pointer;
    display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  .proj-card .cover{ aspect-ratio:1; border-radius:18px; }
  .proj-card-name{ font-weight:600; font-size:15px; padding:0 6px; overflow-wrap:anywhere; }
  .project-badges{ display:flex; flex-wrap:wrap; gap:6px; padding:0 6px; }
  .badge-cat, .badge-tag{ font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; }
  .badge-cat{ background:var(--accent-light); color:var(--accent); }
  .badge-tag{ background:var(--done-bg); color:var(--text-secondary); }

  /* ---------- Нижняя навигация ---------- */
  .bottom-nav{
    position:fixed; left:16px; right:16px; bottom:max(16px, env(safe-area-inset-bottom)); z-index:20;
    height:68px; border-radius:26px; background:var(--card); border:1px solid var(--border);
    box-shadow:0 2px 6px rgba(31,26,36,0.06), 0 14px 34px rgba(31,26,36,0.16);
    display:flex; align-items:center; justify-content:space-around; padding:0 8px; max-width:520px; margin:0 auto;
  }
  body.in-project .bottom-nav{ display:none; }
  .nav-item{
    background:none; color:var(--text-secondary); min-width:64px; height:56px; padding:0; margin:0;
    flex-direction:column; gap:3px; font-size:11px; font-weight:500; border-radius:16px;
  }
  .nav-item:hover{ background:none; color:var(--text); }
  .nav-item.active{ color:var(--text); font-weight:600; }
  .nav-plus{ width:52px; height:52px; min-height:52px; border-radius:18px; padding:0; margin:0; }

  /* ---------- Экран проекта ---------- */
  .project-head{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .project-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .project-chips span{ font-size:12px; font-weight:500; padding:5px 10px; border-radius:999px; background:var(--card); }
  #project-title{ font-size:30px; letter-spacing:-0.03em; line-height:1.15; overflow-wrap:anywhere; }
  .progress-line{ display:flex; align-items:center; gap:10px; }
  .progress-line .track{ flex:1; height:8px; border-radius:4px; background:var(--border); overflow:hidden; }
  .progress-line .fill{ height:100%; width:0; background:var(--accent); border-radius:4px; transition:width .3s ease; }
  .progress-line span{ font-size:13px; font-weight:600; white-space:nowrap; }
  .project-actions{ display:flex; gap:8px; overflow-x:auto; margin:0 -16px 6px; padding:2px 16px 4px; scrollbar-width:none; }
  .project-actions::-webkit-scrollbar{ display:none; }
  .project-actions button{ flex-shrink:0; margin:0; min-height:40px; padding:0 14px; font-size:14px; border-radius:999px; }
  .project-actions .icon-only{ width:40px; padding:0; }
  .photo-gallery{ display:flex; gap:8px; overflow-x:auto; margin:4px -16px 10px; padding:0 16px; scrollbar-width:none; }
  .photo-gallery:empty{ display:none; }
  .photo-gallery img{ width:96px; height:96px; border-radius:18px; object-fit:cover; flex-shrink:0; }

  .section-block{
    background:var(--card); border-radius:24px; padding:14px 10px 10px; margin-bottom:10px;
  }
  .sec-header{ display:flex; align-items:center; gap:4px; padding:0 4px; }
  .sec-toggle{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; cursor:pointer; min-height:44px; }
  .sec-toggle h2{ flex:1; font-size:17px; overflow-wrap:anywhere; }
  .sec-chevron{ color:var(--text-secondary); transition:transform .2s ease; flex-shrink:0; display:flex; }
  .sec-meta{ font-size:13px; color:var(--text-secondary); margin:2px 4px 8px 52px; line-height:1.4; }
  .part-badge{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; font-family:var(--font-body);
  }

  .icon-btn{
    background:none; color:var(--text-secondary); border:none; width:36px; height:36px; min-height:36px;
    padding:0; margin:0; border-radius:12px; flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--done-bg); color:var(--text); }

  .row-item{
    display:flex; align-items:center; gap:10px; min-height:56px; padding:8px 6px 8px 10px;
    border-radius:18px; margin:2px 0; transition:background-color .15s ease;
  }
  .row-num{ width:30px; flex-shrink:0; font-family:var(--font-display); font-size:13px; font-weight:600; color:var(--text); }
  .row-text{ flex:1; min-width:0; }
  .row-desc{ font-size:15px; font-weight:500; line-height:1.35; overflow-wrap:anywhere; }
  .row-sts{ font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .row-note{ font-size:12px; color:var(--text-secondary); margin-top:3px; font-style:italic; }
  .row-item.done .row-desc{ text-decoration:line-through; color:var(--done-text); }
  .row-item.done .row-num{ color:var(--done-text); }
  .row-item.current{ background:var(--ink); color:#fff; }
  .row-item.current .row-num{ color:#fff; }
  .row-item.current .row-sts, .row-item.current .row-note{ color:var(--on-dark-muted); }
  .row-item.current .icon-btn{ color:var(--on-dark-muted); }
  .row-item.current .icon-btn:hover{ background:rgba(255,255,255,0.1); color:#fff; }
  .row-check{
    appearance:none; -webkit-appearance:none; width:28px; height:28px; margin:0 4px; flex-shrink:0;
    border-radius:10px; border:2px solid #D6D0C9; background:transparent; cursor:pointer; position:relative;
  }
  .row-item.current .row-check{ border-color:rgba(255,255,255,0.5); }
  .row-check:checked{ background:var(--accent); border-color:var(--accent); }
  .row-check:checked::after{
    content:''; position:absolute; left:8px; top:3px; width:6px; height:12px;
    border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg);
  }
  .row-actions{ display:flex; align-items:center; opacity:.55; }
  .row-item.current .row-actions, .row-actions:hover, .row-actions:focus-within{ opacity:1; }
  .row-item .inline-form{ flex:1; min-width:0; margin:4px 0; color:var(--text); }
  .add-row-btn{ width:100%; margin:6px 0 2px; }

  /* ---------- Панель текущего ряда ---------- */
  .row-bar{
    position:fixed; left:16px; right:16px; bottom:max(16px, env(safe-area-inset-bottom)); z-index:20;
    max-width:520px; margin:0 auto; border-radius:26px; background:var(--ink); color:#fff;
    padding:12px 12px 12px 20px; display:none; align-items:center; gap:12px;
    box-shadow:0 12px 30px rgba(31,26,36,0.25);
  }
  body.in-project .row-bar.visible{ display:flex; }
  .row-bar-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .row-bar-label{ font-size:12px; color:var(--on-dark-muted); }
  .row-bar-desc{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-bar button{ margin:0; min-height:48px; border-radius:16px; }

  /* ---------- Формы ---------- */
  .inline-form{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:16px; margin:10px 0 14px;
  }
  .inline-form .inline-form{ background:#FAF9F7; }
  .inline-form label{ display:block; font-size:13px; color:var(--text-secondary); margin:12px 0 6px; font-weight:600; }
  .inline-form label:first-child{ margin-top:0; }
  .inline-form > div > label:first-child{ margin-top:12px; }
  .inline-form input, .inline-form textarea, select.form-select, .modal-input{
    width:100%; min-height:48px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-s);
    font-size:15px; font-family:inherit; background:var(--card); color:var(--text);
  }
  .inline-form input:focus, .inline-form textarea:focus, select.form-select:focus, .modal-input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .inline-form textarea{ resize:vertical; min-height:56px; }
  .form-actions{ margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
  .form-actions button{ margin:0; }
  .tag-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .tag-pill{
    font-size:13px; font-weight:500; padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--card); color:var(--text); cursor:pointer;
  }
  .tag-pill.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .new-tag-row{ display:flex; gap:8px; margin-top:10px; }
  .new-tag-row input{ flex:1; }
  .new-tag-row button{ margin:0; }

  /* ---------- Модалка ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(31,26,36,0.5);
    display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:16px;
  }
  .modal-box{ background:var(--card); border-radius:var(--radius-l); padding:22px; max-width:420px; width:100%; }
  .modal-title{ font-weight:600; font-size:18px; margin-bottom:8px; font-family:var(--font-display); letter-spacing:-0.02em; }
  .modal-message{ font-size:14px; color:var(--text-secondary); margin-bottom:14px; line-height:1.45; }
  .modal-input{ margin-bottom:14px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{ margin:0; flex:1; }
  .btn-danger{ background:#B0392E; }
  .btn-danger:hover{ background:#952F26; }

  /* ---------- Индикатор разбора PDF ---------- */
  #pdf-loading{
    display:none; align-items:center; gap:14px; margin:10px 0;
    padding:18px 20px; border-radius:var(--radius-l); background:var(--ink); color:#fff; font-size:14px;
  }
  #pdf-loading.active{ display:flex; }
  .spinner{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    border:3px solid rgba(255,255,255,0.18); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation-duration:3s; } button, .row-item, .progress-line .fill{ transition:none; } }

  .empty-note{ color:var(--text-secondary); font-size:14px; grid-column:1 / -1; margin:6px 0; }

  #toast{
    position:fixed; left:16px; right:16px; top:16px; max-width:520px; margin:0 auto;
    background:var(--ink); color:#fff; padding:14px 16px; border-radius:var(--radius-m);
    font-size:14px; display:none; z-index:200; box-shadow:0 10px 30px rgba(31,26,36,0.25);
  }
  #view-project, #view-categories, #view-subcategories, #view-projects, #view-profile{ display:none; }

  /* ---------- Профиль ---------- */
  .profile-head{ display:flex; align-items:center; gap:14px; margin:4px 0 20px; }
  .profile-avatar{
    width:64px; height:64px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:24px;
  }
  .profile-avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-name{ font-size:24px; line-height:1.15; overflow-wrap:anywhere; }
  .profile-sub{ font-size:14px; color:var(--text-secondary); margin-top:4px; }
  .stats-hero{
    background:var(--ink); color:#fff; border-radius:var(--radius-l); padding:22px 20px;
    display:flex; flex-direction:column; gap:4px;
  }
  .stats-hero b{ font-family:var(--font-display); font-weight:600; font-size:40px; letter-spacing:-0.03em; line-height:1; }
  .stats-hero span{ font-size:14px; color:var(--on-dark-muted); }
  .stat-tile{ background:var(--card); border-radius:24px; padding:16px; display:flex; flex-direction:column; gap:6px; min-height:104px; justify-content:space-between; }
  .stat-tile b{ font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:-0.02em; }
  .stat-tile span{ font-size:13px; color:var(--text-secondary); line-height:1.3; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
  <header class="app-header" id="app-header"></header>
  <p id="status">Подключаемся к базе...</p>

  <div id="view-categories">
    <label class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6470" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="visually-hidden">Поиск</span>
      <input type="search" id="search-input" placeholder="Название или тег">
    </label>
    <button id="add-project-home-btn" style="display:none;">Новый проект</button>
    <div id="project-form-holder-home"></div>
    <div id="search-results" class="card-grid"></div>
    <div id="recent-projects-block" style="display:none;">
      <h2 class="section-title">Сейчас вяжу</h2>
      <div id="hero-holder"></div>
      <h2 class="section-title" id="recent-strip-title" style="display:none;">Недавние</h2>
      <div id="recent-projects-list" class="recent-strip"></div>
    </div>

    // ---------- Запись в базу только через сервер (у клиента теперь нет прав на запись) ----------
    // operation: 'insert' | 'update' | 'upsert' | 'delete'
    // match: обязателен для update/delete — объект вида {id: '...'} (условие WHERE)
    // select: true (вернуть все поля) | 'id, name' (конкретные поля) | не указывать (не нужен результат)
    async function dbWrite(table, operation, payload, match, select) {
      const resp = await fetch('/api/db-write', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table, operation, payload, match, select, requesterId: currentUserId })
      });
      const result = await resp.json();
      if (!resp.ok || result.error) {
        throw new Error(result.error || 'Неизвестная ошибка записи');
      }
      return result.data;
    }

    const SUPABASE_URL = 'https://vcsgpauejnqznygdqxyo.supabase.co';

    // ---------- Фирменные цвета по названию категории (как разные цвета пряжи) ----------
    // Для новых категорий, которые пользователь создаёт сам, используется общий бренд-цвет (запасной)
    const CATEGORY_COLORS = {

    const FALLBACK_COLOR = { main: '#C2335A', light: '#F8E1E7' };

    // ---------- Линейные иконки (вместо эмодзи) ----------
    function svgIcon(paths, size, stroke, width) {
      return `<svg width="${size || 20}" height="${size || 20}" viewBox="0 0 24 24" fill="none" stroke="${stroke || 'currentColor'}" stroke-width="${width || 1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    }
    const ICON_PATHS = {
      back: '<path d="M15 5l-7 7 7 7"/>',
      chevron: '<path d="m6 9 6 6 6-6"/>',
      up: '<path d="m6 15 6-6 6 6"/>',
      down: '<path d="m6 9 6 6 6-6"/>',
      edit: '<path d="M4 20h4L19 9l-4-4L4 16v4Z"/>',
      trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
      arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      check: '<path d="m5 12 5 5 9-10"/>',
      // категории
      'Одежда': '<path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3c0 2-2 3-4 3S8 5 8 3Z"/>',
      'Игрушки': '<circle cx="6.5" cy="6" r="2.5"/><circle cx="17.5" cy="6" r="2.5"/><circle cx="12" cy="13" r="7"/><circle cx="12" cy="15" r="2"/>',
      'Для дома': '<path d="M3 11 12 4l9 7M5 9.5V20h14V9.5M10 20v-6h4v6"/>',
      'Аксессуары': '<path d="M4 9h16l-1.5 11h-13L4 9ZM8.5 9a3.5 3.5 0 0 1 7 0"/>',
      // подкатегории
      'Трикотаж': '<path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3c0 2-2 3-4 3S8 5 8 3Z"/>',
      'Юбки': '<path d="M8 4h8l4 16H4L8 4ZM8 8h8"/>',
      'Платья': '<path d="M9 3h6l-1 5 5 13H5l5-13-1-5Z"/>',
      'Шапки/шарфы': '<path d="M5 15a7 7 0 0 1 14 0M4 15h16v4H4zM12 4v4"/><circle cx="12" cy="3.5" r="1.5"/>',
      'Носки/тапочки': '<path d="M9 3h6v9l3 4a3 3 0 0 1-2.5 5H9a3 3 0 0 1-3-3V3h3"/>',
      'Пледы': '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M3 14h18M9 5v14M15 5v14"/>',
      'Салфетки/скатерти': '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/>',
      'Подушки': '<path d="M5 6c4-2 10-2 14 0 1.5 4 1.5 8 0 12-4 2-10 2-14 0-1.5-4-1.5-8 0-12Z"/>',
      'Корзинки': '<path d="M3 10h18l-2 10H5L3 10ZM7 10l3-6M17 10l-3-6M8 14v3M12 14v3M16 14v3"/>',
      'Сумки': '<path d="M4 9h16l-1.5 11h-13L4 9ZM8.5 9a3.5 3.5 0 0 1 7 0"/>',
      'Украшения': '<path d="M6 3h12l3 5-9 13L3 8l3-5ZM3 8h18M9 3l3 18M15 3l-3 18"/>',
      yarn: '<circle cx="12" cy="12" r="8"/><path d="M5 9c4 2 10 2 14 0M4.5 14c5 2.5 10 2.5 15 0M9 4.5c3 4 3 11 0 15M15 4.5c-3 4-3 11 0 15"/>'
    };
    function icon(name, size, stroke, width) {
      return svgIcon(ICON_PATHS[name] || ICON_PATHS.yarn, size, stroke, width);
    }
    // Иконка категории: своя линейная для известных, иначе эмодзи, который задали при создании
    function categoryIconHtml(cat, size, stroke) {
      if (!cat) return icon('yarn', size, stroke, 1.4);
      if (ICON_PATHS[cat.name]) return icon(cat.name, size, stroke, 1.4);
      const parent = cat.parent_id ? allCategories.find(c => c.id === cat.parent_id) : null;
      if (cat.icon) return `<span class="cat-tile-emoji" aria-hidden="true">${cat.icon}</span>`;
      if (parent && ICON_PATHS[parent.name]) return icon(parent.name, size, stroke, 1.4);
      return icon('yarn', size, stroke, 1.4);
    }

    // ---------- Обложка: фото работы или «вязаная» текстура в цвет категории ----------
    function coverEl(photoUrl, colors, alt) {
      if (photoUrl) {
        const img = document.createElement('img');
        img.className = 'cover';
        img.src = photoUrl;
        img.alt = alt || '';
        img.loading = 'lazy';
        return img;
      }
      const div = document.createElement('div');
      div.className = 'cover';
      div.setAttribute('aria-hidden', 'true');
      const stitch = colors.main + '55';
      div.style.backgroundColor = colors.light;
      div.style.backgroundImage =
        `repeating-linear-gradient(60deg, ${stitch} 0 6px, transparent 6px 14px), repeating-linear-gradient(-60deg, ${stitch} 0 6px, transparent 6px 14px)`;
      return div;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function pluralRu(n, one, few, many) {
      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return one;
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
      return many;
    }

    function getTopCategoryOf(subcategoryId) {
      const subcat = allCategories.find(c => c.id === subcategoryId);
      if (!subcat) return null;
      return subcat.parent_id ? allCategories.find(c => c.id === subcat.parent_id) : subcat;
    }

    function getColorForCategoryName(name) {
      return CATEGORY_COLORS[name] || FALLBACK_COLOR;
    }

    function getColorForSubcategory(subcategoryId) {
      const top = getTopCategoryOf(subcategoryId);
      return top ? getColorForCategoryName(top.name) : FALLBACK_COLOR;
    }

    // ---------- Отрисовка шапки приложения ----------
    // color — больше не используется (оставлен для совместимости вызовов);
    // без onBack — главная: логотип и название; с onBack — круглая кнопка «назад» и заголовок экрана
    function renderAppHeader(color, title, subtitle, onBack) {
      if (!onBack) {
        appHeaderEl.innerHTML = `
          <div class="app-logo">
            <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#C2335A"/><path d="M7 14c6 3 14 3 20 0M6 19c7 3 15 3 22 0M11 8c4 6 4 12 0 18M23 8c-4 6-4 12 0 18" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/></svg>
            <span class="app-logo-text">крючок&nbsp;и&nbsp;клубок</span>
          </div>`;
        return;
      }
      appHeaderEl.innerHTML = `
        <button class="round-btn" id="app-header-back-btn" aria-label="Назад">${icon('back', 20)}</button>
        <div class="app-header-titles">
          ${title ? `<div class="app-header-title">${escapeHtml(title)}</div>` : ''}
          ${subtitle ? `<div class="app-header-sub">${escapeHtml(subtitle)}</div>` : ''}
        </div>`;
      document.getElementById('app-header-back-btn').addEventListener('click', onBack);
    }

    // ---------- Уведомления об ошибках ----------
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      setTimeout(() => { toastEl.style.display = 'none'; }, 4000);
    }

    // ---------- Модалка подтверждения удаления ----------
    // requireWord: если задано (например "Удалить"), кнопка активна только когда текст совпал
    function showConfirmModal({ title, message, requireWord, onConfirm }) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      const box = document.createElement('div');
      box.className = 'modal-box';

      const h = document.createElement('div');
      h.className = 'modal-title';
      h.textContent = title;
      box.appendChild(h);

      const msg = document.createElement('div');
      msg.className = 'modal-message';
      msg.textContent = message;
      box.appendChild(msg);

      let confirmInput = null;
      if (requireWord) {
        confirmInput = document.createElement('input');
        confirmInput.className = 'modal-input';
        confirmInput.placeholder = 'Введите "' + requireWord + '"';
        box.appendChild(confirmInput);
      }

      const actions = document.createElement('div');
      actions.className = 'modal-actions';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';

      const okBtn = document.createElement('button');
      okBtn.className = 'btn-danger';
      okBtn.textContent = 'Удалить';
      if (requireWord) okBtn.disabled = true;

      actions.appendChild(cancelBtn);
      actions.appendChild(okBtn);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      if (requireWord) {
        confirmInput.addEventListener('input', () => {
          okBtn.disabled = confirmInput.value.trim() !== requireWord;
        });
      }

      cancelBtn.addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      okBtn.addEventListener('click', async () => {
        if (requireWord && confirmInput.value.trim() !== requireWord) return;
        okBtn.disabled = true;
        await onConfirm();
        overlay.remove();
      });
    }

    // ---------- Помощник: создать инлайн-форму ----------
    // fields: [{name, label, type: 'text'|'number'|'textarea', placeholder}]
    function buildForm(fields, onSubmit, submitLabel) {
      const form = document.createElement('div');
      form.className = 'inline-form';

      const inputs = {};
      fields.forEach(f => {
        const label = document.createElement('label');
        label.textContent = f.label;
        form.appendChild(label);

        const input = f.type === 'textarea'
          ? document.createElement('textarea')
          : document.createElement('input');
        if (f.type !== 'textarea') input.type = f.type || 'text';
        if (f.placeholder) input.placeholder = f.placeholder;
        form.appendChild(input);
        inputs[f.name] = input;
      });

      const actions = document.createElement('div');
      actions.className = 'form-actions';

      const saveBtn = document.createElement('button');
      saveBtn.textContent = submitLabel || 'Сохранить';
      actions.appendChild(saveBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(cancelBtn);

      form.appendChild(actions);

      cancelBtn.addEventListener('click', () => form.remove());
      saveBtn.addEventListener('click', async () => {
        const values = {};
        fields.forEach(f => { values[f.name] = inputs[f.name].value.trim(); });
        saveBtn.disabled = true;
        await onSubmit(values, form);
        saveBtn.disabled = false;
      });

      return form;
    }

    // ---------- Категории и теги (общие справочники) ----------
    async function loadCategories() {
      const { data, error } = await sb.from('categories').select('*').order('name');
      if (error) { showToast('Ошибка загрузки категорий: ' + error.message); return; }
      allCategories = data || [];
    }

    async function loadTags() {
      const { data, error } = await sb.from('tags').select('*').order('name');
      if (error) { showToast('Ошибка загрузки тегов: ' + error.message); return; }
      allTags = data || [];
    }

    function getCategoryName(id) {
      const cat = allCategories.find(c => c.id === id);
      return cat ? cat.name : null;
    }

    function getCategoryIcon(subcategoryId) {
      const subcat = allCategories.find(c => c.id === subcategoryId);
      if (!subcat) return '🧶';
      if (subcat.icon) return subcat.icon;
      const parent = subcat.parent_id ? allCategories.find(c => c.id === subcat.parent_id) : null;
      return (parent && parent.icon) || '🧶';
    }

    async function loadPhotoMap() {
      const { data, error } = await sb.from('photos').select('*').order('created_at', { ascending: false });
      if (error) { showToast('Ошибка загрузки фото: ' + error.message); return; }
      photoMap = {};
      (data || []).forEach(p => {
        if (!photoMap[p.project_id]) photoMap[p.project_id] = p.url; // первое = самое свежее
      });
    }

    // ---------- Личный прогресс по рядам (свой для каждого пользователя Telegram) ----------
    async function loadRowProgress(rowIds) {
      if (!rowIds.length) return new Set();
      const { data, error } = await sb
        .from('row_progress')
        .select('row_id, updated_at')
        .eq('telegram_user_id', currentUserId)
        .in('row_id', rowIds);
      if (error) { showToast('Ошибка загрузки прогресса: ' + error.message); return new Set(); }
      const set = new Set((data || []).map(x => x.row_id));
      // когда последний раз отмечали ряд в этой детали — по этому выбираем, какую деталь вы сейчас вяжете
      set._lastTouched = (data || []).reduce((max, x) => {
        const t = x.updated_at ? new Date(x.updated_at).getTime() : 0;
        return t > max ? t : max;
      }, 0);
      return set;
    }

    // ---------- Загрузка всех проектов (кэш для поиска и списков по подкатегориям) ----------
    async function loadProjects() {
      const { data, error } = await sb
        .from('projects')
        .select('*, project_tags(tags(name))')
        .order('created_at', { ascending: false });
      if (error) { showToast('Ошибка: ' + error.message); return; }
      projectsCache = data || [];
    }

    // ---------- «Сейчас вяжу» + недавние проекты (на главном экране) ----------
    const heroHolderEl = document.getElementById('hero-holder');
    const recentStripTitleEl = document.getElementById('recent-strip-title');

    function renderHeroEmpty() {
      heroHolderEl.innerHTML = '';
      const hero = document.createElement('div');
      hero.className = 'hero';
      hero.innerHTML = `
        <div class="hero-empty">
          <div class="hero-title">Пока ничего не вяжется</div>
          <p>Создайте проект и загрузите PDF-схему — ряды разложатся в чеклист сами.</p>
        </div>`;
      const btn = document.createElement('button');
      btn.className = 'hero-btn';
      btn.innerHTML = 'Новый проект ' + icon('arrow', 18, '#fff', 2);
      btn.addEventListener('click', openNewProjectForm);
      hero.appendChild(btn);
      heroHolderEl.appendChild(hero);
      recentStripTitleEl.style.display = 'none';
      recentProjectsListEl.innerHTML = '';
    }

    function renderHero(p, t, next) {
      heroHolderEl.innerHTML = '';
      const pct = t.total ? Math.round((t.done / t.total) * 100) : 0;
      const C = 2 * Math.PI * 34;
      const subcat = allCategories.find(c => c.id === p.subcategory_id);
      const top = getTopCategoryOf(p.subcategory_id);
      const chip = top ? top.name : (subcat ? subcat.name : '');

      let subText = '';
      if (!t.total) subText = 'Рядов пока нет';
      else if (next) subText = `${next.sectionTitle} · ряд ${next.rowNumber}`;
      else subText = 'Все ряды связаны';

      const hero = document.createElement('div');
      hero.className = 'hero';
      hero.innerHTML = `
        <div class="hero-top">
          <div class="hero-info">
            ${chip ? `<span class="hero-chip">${escapeHtml(chip)}</span>` : ''}
            <div class="hero-title">${escapeHtml(p.name)}</div>
            <div class="hero-sub">${escapeHtml(subText)}</div>
          </div>
          <div class="hero-ring" role="img" aria-label="Готово ${pct}%">
            <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
              <circle cx="42" cy="42" r="34" stroke="rgba(255,255,255,0.14)" stroke-width="9" fill="none"/>
              <circle cx="42" cy="42" r="34" stroke="#C2335A" stroke-width="9" fill="none" stroke-linecap="round"
                stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}" transform="rotate(-90 42 42)"/>
            </svg>
            <div class="hero-ring-label"><b>${pct}%</b><span>проекта</span></div>
          </div>
        </div>`;
      const btn = document.createElement('button');
      btn.className = 'hero-btn';
      btn.innerHTML = (next ? `Продолжить с ряда ${next.rowNumber} ` : 'Открыть проект ') + icon('arrow', 18, '#fff', 2);
      btn.addEventListener('click', () => openProject(p.id, p.name));
      hero.appendChild(btn);
      heroHolderEl.appendChild(hero);
    }

    function recentCardEl(p, t) {
      const colors = getColorForSubcategory(p.subcategory_id);
      const pct = t.total ? Math.round((t.done / t.total) * 100) : 0;
      const card = document.createElement('button');
      card.className = 'recent-card';
      card.style.cssText = 'background:var(--card); color:var(--text); margin:0; padding:8px 8px 14px; align-items:stretch; text-align:left; min-height:0;';
      card.appendChild(coverEl(photoMap[p.id], colors, p.name));
      const body = document.createElement('div');
      body.className = 'recent-card-body';
      body.innerHTML = `
        <span class="recent-card-name">${escapeHtml(p.name)}</span>
        <span class="recent-card-cat">${escapeHtml(getCategoryName(p.subcategory_id) || '')}</span>`;
      card.appendChild(body);
      if (t.total) {
        const prog = document.createElement('div');
        prog.className = 'mini-progress';
        prog.innerHTML = `<div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span>`;
        card.appendChild(prog);
      }
      card.addEventListener('click', () => openProject(p.id, p.name));
      return card;
    }

    async function renderRecentProjects() {
      recentProjectsBlockEl.style.display = 'block';
      recentProjectsListEl.innerHTML = '';

      // 1. Берём последние по времени отметки ряда этого пользователя
      const { data: progressRows, error: progError } = await sb
        .from('row_progress')
        .select('row_id, updated_at')
        .eq('telegram_user_id', currentUserId)
        .order('updated_at', { ascending: false })
        .limit(150);

      if (progError) { showToast('Ошибка: ' + progError.message); return; }
      if (!progressRows || !progressRows.length) { renderHeroEmpty(); return; }

      // 2. Ряд -> деталь -> проект, чтобы понять, какому проекту принадлежит каждая отметка
      const recentRowIds = progressRows.map(pr => pr.row_id);
      const { data: rowsData } = await sb.from('rows').select('id, section_id').in('id', recentRowIds);
      const rowToSection = {};
      (rowsData || []).forEach(r => { rowToSection[r.id] = r.section_id; });

      const sectionIds = [...new Set(Object.values(rowToSection))];
      let sectionToProject = {};
      if (sectionIds.length) {
        const { data: sectionsData } = await sb.from('sections').select('id, project_id').in('id', sectionIds);
        (sectionsData || []).forEach(s => { sectionToProject[s.id] = s.project_id; });
      }

      // 3. Идём по отметкам от самой свежей и берём до 6 РАЗНЫХ проектов
      const recentProjectIds = [];
      for (const pr of progressRows) {
        const projId = sectionToProject[rowToSection[pr.row_id]];
        if (projId && !recentProjectIds.includes(projId) && projectsCache.some(p => p.id === projId)) {
          recentProjectIds.push(projId);
          if (recentProjectIds.length === 6) break;
        }
      }
      if (!recentProjectIds.length) { renderHeroEmpty(); return; }

      const recent = recentProjectIds.map(id => projectsCache.find(p => p.id === id)).filter(Boolean);

      // 4. Прогресс (done/total) по каждому проекту — среди ВСЕХ его рядов
      const { data: allSections } = await sb.from('sections').select('id, project_id, title, position').in('project_id', recentProjectIds);
      const sectionsById = {};
      (allSections || []).forEach(s => { sectionsById[s.id] = s; });
      const allSectionIds = Object.keys(sectionsById);

      let allRows = [];
      if (allSectionIds.length) {
        const { data } = await sb.from('rows').select('id, section_id, row_number, position').in('section_id', allSectionIds);
        allRows = data || [];
      }

      let allCheckedRowIds = new Set();
      if (allRows.length) {
        const { data } = await sb.from('row_progress').select('row_id')
          .eq('telegram_user_id', currentUserId).in('row_id', allRows.map(r => r.id));
        allCheckedRowIds = new Set((data || []).map(x => x.row_id));
      }

      const totals = {};
      recentProjectIds.forEach(id => { totals[id] = { done: 0, total: 0 }; });
      allRows.forEach(r => {
        const sec = sectionsById[r.section_id];
        if (!sec || !totals[sec.project_id]) return;
        totals[sec.project_id].total++;
        if (allCheckedRowIds.has(r.id)) totals[sec.project_id].done++;
      });

      // 5. Для главного проекта ищем следующий несвязанный ряд (по порядку деталей и рядов)
      const main = recent[0];
      const mainRows = allRows
        .filter(r => sectionsById[r.section_id] && sectionsById[r.section_id].project_id === main.id)
        .sort((a, b) => (sectionsById[a.section_id].position - sectionsById[b.section_id].position) || (a.position - b.position));
      const nextRow = mainRows.find(r => !allCheckedRowIds.has(r.id));
      const next = nextRow ? { rowNumber: nextRow.row_number, sectionTitle: sectionsById[nextRow.section_id].title } : null;

      renderHero(main, totals[main.id], next);

      const rest = recent.slice(1);
      recentStripTitleEl.style.display = rest.length ? '' : 'none';
      rest.forEach(p => recentProjectsListEl.appendChild(recentCardEl(p, totals[p.id])));
    }

    // ---------- Карточка проекта (переиспользуется в поиске и списке по подкатегории) ----------
    function createProjectItemEl(p) {
      const colors = getColorForSubcategory(p.subcategory_id);
      const card = document.createElement('div');
      card.className = 'proj-card';
      card.setAttribute('role', 'button');
      card.tabIndex = 0;
      card.appendChild(coverEl(photoMap[p.id], colors, p.name));

      const name = document.createElement('div');
      name.className = 'proj-card-name';
      name.textContent = p.name;
      card.appendChild(name);

      const badges = document.createElement('div');
      badges.className = 'project-badges';
      const subcatName = getCategoryName(p.subcategory_id);
      if (subcatName) {
        const catBadge = document.createElement('span');
        catBadge.className = 'badge-cat';
        catBadge.textContent = subcatName;
        badges.appendChild(catBadge);
      }
      (p.project_tags || []).forEach(pt => {
        if (!pt.tags?.name) return;
        const tagBadge = document.createElement('span');
        tagBadge.className = 'badge-tag';
        tagBadge.textContent = pt.tags.name;
        badges.appendChild(tagBadge);
      });
      if (badges.children.length) card.appendChild(badges);

      card.addEventListener('click', () => openProject(p.id, p.name));
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProject(p.id, p.name); } });
      return card;
    }

    function emptyMessage(text) {
      const empty = document.createElement('p');
      empty.className = 'empty-note';
      empty.textContent = text;
      return empty;
    }

    // Плитка категории / подкатегории
    function categoryTileEl(cat, metaText, dark) {
      const tile = document.createElement('button');
      tile.className = 'cat-tile' + (dark ? ' dark' : '');
      tile.style.margin = '0';
      tile.innerHTML = `
        ${categoryIconHtml(cat, 34, 'currentColor')}
        <span><span class="cat-tile-name" style="display:block;">${escapeHtml(cat.name)}</span>
        <span class="cat-tile-meta" style="display:block;">${escapeHtml(metaText)}</span></span>`;
      return tile;
    }

    function countProjectsIn(catId) {
      const ids = new Set([catId, ...allCategories.filter(c => c.parent_id === catId).map(c => c.id)]);
      return projectsCache.filter(p => ids.has(p.subcategory_id)).length;
    }

    function projectsMeta(n) {
      return n ? n + ' ' + pluralRu(n, 'проект', 'проекта', 'проектов') : 'Пока пусто';
    }

    // ---------- Уровень 1: Категории ----------
    function renderCategoryGrid() {
      categoryGridEl.innerHTML = '';
      const topLevel = allCategories.filter(c => !c.parent_id);
      topLevel.forEach(cat => {
        const tile = categoryTileEl(cat, projectsMeta(countProjectsIn(cat.id)), false);
        tile.addEventListener('click', () => openCategory(cat));
        categoryGridEl.appendChild(tile);
      });
    }

    function openCategory(cat) {
      currentCategoryId = cat.id;
      const subcats = allCategories.filter(c => c.parent_id === cat.id);

      if (subcats.length === 1) {
        // Единственная подкатегория — сразу переходим к проектам, минуя лишний шаг
        openSubcategory(subcats[0]);
        return;
      }

      renderAppHeader(null, cat.name, 'Выберите раздел', () => {
        document.getElementById('back-to-categories-btn').click();
      });

      categoryTitleEl.textContent = cat.name;
      subcategoryGridEl.innerHTML = '';
      if (!subcats.length) subcategoryGridEl.appendChild(emptyMessage('В этой категории пока нет разделов'));
      subcats.forEach(sc => {
        const n = projectsCache.filter(p => p.subcategory_id === sc.id).length;
        const tile = categoryTileEl(sc, projectsMeta(n), false);
        tile.addEventListener('click', () => openSubcategory(sc));
        subcategoryGridEl.appendChild(tile);
      });

      viewCategories.style.display = 'none';
      viewSubcategories.style.display = 'block';
      window.scrollTo(0, 0);
    }

    document.getElementById('back-to-categories-btn').addEventListener('click', () => {
      currentCategoryId = null;
      viewSubcategories.style.display = 'none';
      viewCategories.style.display = 'block';
      renderAppHeader(null, null, null, null);
    });

    // ---------- Уровень 2: Подкатегории → проекты ----------
    function openSubcategory(subcat) {
      currentSubcategoryId = subcat.id;
      currentCategoryId = subcat.parent_id;
      const parentCat = allCategories.find(c => c.id === subcat.parent_id);
      const colors = getColorForSubcategory(subcat.id);

      subcategoryTitleEl.textContent = subcat.name;
      backToSubcatLabelEl.textContent = parentCat ? parentCat.name : 'Категории';

      renderAppHeader(null, subcat.name, parentCat ? parentCat.name : '', () => {
        document.getElementById('back-to-subcategories-btn').click();
      });

      viewCategories.style.display = 'none';
      viewSubcategories.style.display = 'none';
      viewProjects.style.display = 'block';

      renderSubcategoryProjects();
    }

    function renderSubcategoryProjects() {
      projectListEl.innerHTML = '';
      const filtered = projectsCache.filter(p => p.subcategory_id === currentSubcategoryId);
      if (!filtered.length) {
        projectListEl.appendChild(emptyMessage('Пока нет проектов в этой подкатегории'));
        return;
      }
      filtered.forEach(p => projectListEl.appendChild(createProjectItemEl(p)));
    }

    // Обновляет тот список, который сейчас реально виден пользователю
    // (нужна, т.к. "+ Новый проект" теперь доступна с трёх разных экранов)
    function refreshCurrentListView() {
      if (viewProjects.style.display === 'block') {
        renderSubcategoryProjects();
      } else if (viewCategories.style.display === 'block') {
        renderSearchResults(searchInput.value.trim().toLowerCase());
      }
      // на экране подкатегорий (view-subcategories) обновлять нечего — там нет списка проектов
    }

    document.getElementById('back-to-subcategories-btn').addEventListener('click', () => {
      currentSubcategoryId = null;
      viewProjects.style.display = 'none';

      const parentCat = allCategories.find(c => c.id === currentCategoryId);
      const siblingSubcats = parentCat ? allCategories.filter(c => c.parent_id === parentCat.id) : [];

      if (parentCat && siblingSubcats.length > 1) {
        viewSubcategories.style.display = 'block';
        const colors = getColorForCategoryName(parentCat.name);
        renderAppHeader(null, parentCat.name, 'Выберите раздел', () => {
          document.getElementById('back-to-categories-btn').click();
        });
      } else {
        // если у категории была всего 1 подкатегория (мы её пропускали) — возвращаемся сразу к категориям
        currentCategoryId = null;
        viewCategories.style.display = 'block';
        renderAppHeader(null, null, null, null);
      }
    });

    // ---------- Глобальный поиск (на главном экране, по всем категориям) ----------
    function renderSearchResults(filterText) {
      if (!filterText) {
        searchResultsEl.innerHTML = '';
        categoryGridEl.style.display = 'grid';
        categoryGridTitleEl.style.display = '';
        if (projectsCache.length) recentProjectsBlockEl.style.display = 'block';
        return;
      }
      categoryGridEl.style.display = 'none';
      categoryGridTitleEl.style.display = 'none';
      recentProjectsBlockEl.style.display = 'none';
      searchResultsEl.innerHTML = '';

      const filtered = projectsCache.filter(p => {
        const tagNames = (p.project_tags || []).map(pt => pt.tags?.name?.toLowerCase() || '');
        return p.name.toLowerCase().includes(filterText) || tagNames.some(t => t.includes(filterText));
      });

      if (!filtered.length) {
        searchResultsEl.appendChild(emptyMessage('Ничего не найдено'));
        return;
      }
      filtered.forEach(p => searchResultsEl.appendChild(createProjectItemEl(p)));
    }

    searchInput.addEventListener('input', () => {
      renderSearchResults(searchInput.value.trim().toLowerCase());
    });

    document.getElementById('add-project-btn').addEventListener('click', () => {
      projectFormHolder.innerHTML = '';
      projectFormHolder.appendChild(buildProjectForm({ presetSubcategoryId: currentSubcategoryId }));
    });

    const projectFormHolderHome = document.getElementById('project-form-holder-home');
    document.getElementById('add-project-home-btn').addEventListener('click', () => {
      projectFormHolderHome.innerHTML = '';
      projectFormHolderHome.appendChild(buildProjectForm());
    });

    const projectFormHolderCategory = document.getElementById('project-form-holder-category');
    document.getElementById('add-project-category-btn').addEventListener('click', () => {
      projectFormHolderCategory.innerHTML = '';
      projectFormHolderCategory.appendChild(buildProjectForm({ presetCategoryId: currentCategoryId }));
    });

    // ---------- Нижняя навигация ----------
    function scrollToEl(el) {
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function openNewProjectForm() {
      // форма открывается в контексте текущего экрана: с подставленной категорией/подкатегорией
      if (viewProfile.style.display === 'block' || viewProject.style.display === 'block') {
        // из профиля (и любого экрана без своей формы) — сначала на главную, там форма и откроется
        await goHome();
      }
      if (viewProjects.style.display === 'block') {
        document.getElementById('add-project-btn').click();
        scrollToEl(projectFormHolder);
      } else if (viewSubcategories.style.display === 'block') {
        document.getElementById('add-project-category-btn').click();
        scrollToEl(projectFormHolderCategory);
      } else {
        document.getElementById('add-project-home-btn').click();
        scrollToEl(projectFormHolderHome);
        const nameInput = projectFormHolderHome.querySelector('input');
        if (nameInput) nameInput.focus({ preventScroll: true });
      }
    }

    function closeOpenForms() {
      [projectFormHolderHome, projectFormHolderCategory, projectFormHolder,
       document.getElementById('project-edit-form-holder'), sectionFormHolder].forEach(h => { if (h) h.innerHTML = ''; });
    }

    async function goHome() {
      closeOpenForms();
      currentProjectId = null;
      currentSubcategoryId = null;
      currentCategoryId = null;
      previousViewEl = viewCategories;
      await returnToPreviousView();
      window.scrollTo(0, 0);
    }

    document.getElementById('nav-home').addEventListener('click', () => {
      searchInput.value = '';
      goHome();
    });
    document.getElementById('nav-add').addEventListener('click', openNewProjectForm);
    document.getElementById('nav-profile').addEventListener('click', openProfile);

    // ---------- Профиль со статистикой ----------
    async function openProfile() {
      closeOpenForms();
      hideAllTopViews();
      viewProfile.style.display = 'block';
      document.getElementById('nav-profile').classList.add('active');
      renderAppHeader(null, null, null, null);
      window.scrollTo(0, 0);

      const tgUser = (Telegram.WebApp.initDataUnsafe || {}).user || {};
      const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || 'Моё вязание';
      document.getElementById('profile-name').textContent = fullName;
      const avatarEl = document.getElementById('profile-avatar');
      avatarEl.innerHTML = '';
      if (tgUser.photo_url) {
        const img = document.createElement('img');
        img.src = tgUser.photo_url; img.alt = '';
        avatarEl.appendChild(img);
      } else {
        avatarEl.textContent = fullName.trim().charAt(0).toUpperCase();
      }

      const heroEl = document.getElementById('stats-hero');
      const gridEl = document.getElementById('stats-grid');
      const doneTitleEl = document.getElementById('profile-done-title');
      const doneListEl = document.getElementById('profile-done-list');
      heroEl.innerHTML = '<span>Считаем...</span>';
      gridEl.innerHTML = '';
      doneListEl.innerHTML = '';
      doneTitleEl.style.display = 'none';

      try {
        // все отметки этого пользователя
        const { data: progress, error: pErr } = await sb.from('row_progress')
          .select('row_id').eq('telegram_user_id', currentUserId);
        if (pErr) throw pErr;
        const checked = new Set((progress || []).map(x => x.row_id));

        const { data: sections, error: sErr } = await sb.from('sections').select('id, project_id');
        if (sErr) throw sErr;
        const { data: rows, error: rErr } = await sb.from('rows').select('id, section_id, total_stitches');
        if (rErr) throw rErr;

        const secToProject = {};
        (sections || []).forEach(sc => { secToProject[sc.id] = sc.project_id; });
        const perSection = {}, perProject = {};
        let stitches = 0, rowsDone = 0;
        (rows || []).forEach(r => {
          const ps = perSection[r.section_id] || (perSection[r.section_id] = { done: 0, total: 0 });
          const pid = secToProject[r.section_id];
          const pp = perProject[pid] || (perProject[pid] = { done: 0, total: 0 });
          ps.total++; pp.total++;
          if (checked.has(r.id)) {
            ps.done++; pp.done++; rowsDone++;
            stitches += r.total_stitches || 0;
          }
        });
        const partsDone = Object.values(perSection).filter(x => x.total && x.done === x.total).length;
        const projIds = Object.keys(perProject).filter(id => projectsCache.some(p => p.id === id));
        const finished = projIds.filter(id => perProject[id].total && perProject[id].done === perProject[id].total);
        const inWork = projIds.filter(id => perProject[id].done > 0 && perProject[id].done < perProject[id].total);
        const mine = projectsCache.filter(p => p.created_by === currentUserId).length;

        document.getElementById('profile-sub').textContent =
          inWork.length ? 'Сейчас в работе: ' + inWork.length + ' ' + pluralRu(inWork.length, 'проект', 'проекта', 'проектов') : 'Пока ничего не в работе';

        heroEl.innerHTML = `<b>${stitches.toLocaleString('ru-RU')}</b><span>${pluralRu(stitches, 'петля связана', 'петли связано', 'петель связано')} по отмеченным рядам</span>`;

        const tiles = [
          [rowsDone, pluralRu(rowsDone, 'ряд связан', 'ряда связано', 'рядов связано')],
          [partsDone, pluralRu(partsDone, 'деталь готова', 'детали готовы', 'деталей готово')],
          [finished.length, pluralRu(finished.length, 'проект завершён', 'проекта завершено', 'проектов завершено')],
          [mine, pluralRu(mine, 'проект создан мной', 'проекта создано мной', 'проектов создано мной')]
        ];
        tiles.forEach(([n, label]) => {
          const t = document.createElement('div');
          t.className = 'stat-tile';
          t.innerHTML = `<b>${n}</b><span>${escapeHtml(label)}</span>`;
          gridEl.appendChild(t);
        });

        if (finished.length) {
          doneTitleEl.style.display = '';
          finished.forEach(id => {
            const p = projectsCache.find(x => x.id === id);
            if (p) doneListEl.appendChild(createProjectItemEl(p));
          });
        }
      } catch (e) {
        heroEl.innerHTML = '<span>Не удалось посчитать статистику</span>';
        showToast('Ошибка: ' + (e.message || e));
      }
    }

    function buildProjectForm(opts) {
      opts = opts || {};
      const isEdit = opts.mode === 'edit';
      const project = opts.project || null;
      const existingTagIds = opts.existingTagIds || new Set();

      const form = document.createElement('div');
      form.className = 'inline-form';

      // Название
      const nameLabel = document.createElement('label');
      nameLabel.textContent = 'Название проекта';
      form.appendChild(nameLabel);
      const nameInput = document.createElement('input');
      nameInput.placeholder = 'Например: Тыква-брелок';
      if (isEdit) nameInput.value = project.name;

      subcatSelect.addEventListener('change', () => {

      // Предзаполнение в режиме редактирования

      // Предзаполнение при создании из конкретной подкатегории

      if (!isEdit && !opts.presetSubcategoryId && opts.presetCategoryId) {

      // Теги

      const selectedTagIds = new Set(isEdit ? existingTagIds : []);

      function renderTagPills() {
        tagPicker.innerHTML = '';
        allTags.forEach(t => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill' + (selectedTagIds.has(t.id) ? ' selected' : '');
          pill.textContent = t.name;
          pill.addEventListener('click', () => {
            if (selectedTagIds.has(t.id)) selectedTagIds.delete(t.id);

      const newTagRow = document.createElement('div');

      // Кнопки
      const actions = document.createElement('div');

      saveBtn.addEventListener('click', async () => {

        if (catSelect.value === '__new_category__') { showToast('Сначала создайте категорию (кнопка "Создать категорию")'); return; }
        if (!subcatSelect.value || subcatSelect.value === '__new_subcategory__') {
          showToast(subcatSelect.value === '__new_subcategory__'
