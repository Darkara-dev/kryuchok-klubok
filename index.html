    // ---------- Открытие проекта ----------
    let previousViewEl = null;
    let sectionCountChip = null;

    // ---------- Панель текущего ряда и общий прогресс проекта ----------
    const rowBarEl = document.getElementById('row-bar');
    const rowBarLabelEl = document.getElementById('row-bar-label');
    const rowBarDescEl = document.getElementById('row-bar-desc');
    const rowBarBtn = document.getElementById('row-bar-btn');
    let currentRowRef = null;

    // Проходит по всем деталям сверху вниз и находит первый неотмеченный ряд —
    // подсвечивает его, обновляет нижнюю панель и полоску прогресса проекта
    function updateCurrentRow() {
      let done = 0, total = 0;
      currentRowRef = null;
      let currentSectionTitle = '';
      sectionListEl.querySelectorAll('.row-item.current').forEach(el => el.classList.remove('current'));
      const blocks = Array.from(sectionListEl.children).filter(b => b._rowsWrap);
      blocks.forEach(block => {
        (block._rowsWrap._refs || []).forEach(ref => { total++; if (ref.checkbox.checked) done++; });
      });

      // Деталь, с которой вы работали последней (отмечали ряд или раскрыли её).
      // Детали можно вязать не по порядку — поэтому ищем текущий ряд начиная с неё,
      // а если она готова, идём к следующим и по кругу к пропущенным выше.
      let startIdx = 0, bestTime = 0;
      blocks.forEach((b, i) => { const t = b._rowsWrap._lastTouched || 0; if (t > bestTime) { bestTime = t; startIdx = i; } });
      for (let k = 0; k < blocks.length && !currentRowRef; k++) {
        const block = blocks[(startIdx + k) % blocks.length];
        const ref = (block._rowsWrap._refs || []).find(r => !r.checkbox.checked);
        if (ref) { currentRowRef = ref; currentSectionTitle = block._sectionTitle || ''; }
      }

      const progressEl = document.getElementById('project-progress');
      if (total) {
        progressEl.style.display = '';
        document.getElementById('project-progress-fill').style.width = Math.round(done / total * 100) + '%';
        document.getElementById('project-progress-text').textContent = done + ' / ' + total + ' ' + pluralRu(total, 'ряд', 'ряда', 'рядов');
      } else {
        progressEl.style.display = 'none';
      }

      if (!total) { rowBarEl.classList.remove('visible'); return; }
      rowBarEl.classList.add('visible');
      if (currentRowRef) {
        currentRowRef.item.classList.add('current');
        rowBarLabelEl.textContent = (currentSectionTitle ? currentSectionTitle + ' · ' : '') + 'ряд ' + currentRowRef.rowNumber;
        rowBarDescEl.textContent = currentRowRef.description;
        rowBarBtn.style.display = '';
      } else {
        rowBarLabelEl.textContent = 'Все ряды связаны';
        rowBarDescEl.textContent = 'Отличная работа!';
        rowBarBtn.style.display = 'none';
      }
    }

    rowBarBtn.addEventListener('click', () => {
      if (!currentRowRef) return;
      const ref = currentRowRef;
      ref.checkbox.checked = true;
      ref.checkbox.dispatchEvent(new Event('change'));
      // если следующий ряд в свёрнутой детали или за краем экрана — показываем его
      requestAnimationFrame(() => {
        if (!currentRowRef) return;
        const body = currentRowRef.item.closest('.part-body');
        if (body && body.style.display === 'none' && body._expand) { body._autoExpand = true; body._expand(); body._autoExpand = false; }
        const r = currentRowRef.item.getBoundingClientRect();
        if (r.top < 80 || r.bottom > window.innerHeight - 110) {
          currentRowRef.item.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    });

    function hideAllTopViews() {
      document.body.classList.remove('in-project');
      document.getElementById('nav-home').classList.remove('active');
      viewCategories.style.display = 'none';
      viewSubcategories.style.display = 'none';
      viewProjects.style.display = 'none';
      viewProject.style.display = 'none';
      viewProfile.style.display = 'none';
      document.getElementById('nav-profile').classList.remove('active');
    }

    function currentVisibleTopView() {
      if (viewProfile.style.display === 'block') return viewProfile;
      if (viewProjects.style.display === 'block') return viewProjects;
      if (viewSubcategories.style.display === 'block') return viewSubcategories;
      return viewCategories;
    }

    async function returnToPreviousView() {
      if (previousViewEl === viewProfile) { await openProfile(); return; }
      hideAllTopViews();
      await loadProjects();
      await loadPhotoMap();
      if (previousViewEl === viewProjects) {
        viewProjects.style.display = 'block';
        const subcat = allCategories.find(c => c.id === currentSubcategoryId);
        if (subcat) {
          const colors = getColorForSubcategory(subcat.id);
          const parentCat = allCategories.find(c => c.id === subcat.parent_id);
          renderAppHeader(null, subcat.name, parentCat ? parentCat.name : '', () => {
            document.getElementById('back-to-subcategories-btn').click();
          });
        }
        renderSubcategoryProjects();
      } else if (previousViewEl === viewSubcategories) {
        viewSubcategories.style.display = 'block';
        const cat = allCategories.find(c => c.id === currentCategoryId);
        if (cat) {
          const colors = getColorForCategoryName(cat.name);
          renderAppHeader(null, cat.name, 'Выберите раздел', () => {
            document.getElementById('back-to-categories-btn').click();
          });
        }
      } else {
        viewCategories.style.display = 'block';
        document.getElementById('nav-home').classList.add('active');
        renderAppHeader(null, null, null, null);
        renderCategoryGrid();
        await renderRecentProjects();
        renderSearchResults(searchInput.value.trim().toLowerCase());
      }
    }

    async function openProject(id, name) {
      previousViewEl = currentVisibleTopView();
      currentProjectId = id;
      projectTitleEl.textContent = name;

      const cached = projectsCache.find(p => p.id === id);
      currentProjectAuthor = cached ? cached.created_by : null;
      document.getElementById('delete-project-btn').style.display = canDelete(currentProjectAuthor) ? '' : 'none';

      renderAppHeader(null, null, null, () => {
        document.getElementById('back-btn').click();
      });

      // Чипы над заголовком: категория и теги
      const chipsEl = document.getElementById('project-chips');
      chipsEl.innerHTML = '';
      const chipTexts = [];
      if (cached) {
        const catName = getCategoryName(cached.subcategory_id);
        if (catName) chipTexts.push(catName);
        (cached.project_tags || []).forEach(pt => { if (pt.tags?.name) chipTexts.push(pt.tags.name); });
      }
      chipTexts.forEach(t => {
        const span = document.createElement('span');
        span.textContent = t;
        chipsEl.appendChild(span);
      });
      sectionCountChip = document.createElement('span');
      sectionCountChip.style.display = 'none';
      chipsEl.appendChild(sectionCountChip);
      document.getElementById('project-progress').style.display = 'none';

      hideAllTopViews();
      viewProject.style.display = 'block';
      document.body.classList.add('in-project');
      rowBarEl.classList.remove('visible');
      window.scrollTo(0, 0);
      sectionFormHolder.innerHTML = '';
      await loadProjectPhotos();
      await loadSections();
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      currentProjectId = null;
      returnToPreviousView();
    });

    const projectEditFormHolder = document.getElementById('project-edit-form-holder');

    document.getElementById('edit-project-btn').addEventListener('click', async () => {
      const { data: project, error } = await sb.from('projects').select('*').eq('id', currentProjectId).single();
      if (error) { showToast('Ошибка: ' + error.message); return; }

      const { data: existingTags } = await sb.from('project_tags').select('tag_id').eq('project_id', currentProjectId);
      const existingTagIds = new Set((existingTags || []).map(t => t.tag_id));

      projectEditFormHolder.innerHTML = '';
      projectEditFormHolder.appendChild(buildProjectForm({ mode: 'edit', project, existingTagIds }));
    });

    document.getElementById('delete-project-btn').addEventListener('click', () => {
      showConfirmModal({
        title: 'Удалить проект?',
        message: 'Проект "' + projectTitleEl.textContent + '" со всеми деталями, рядами и фото будет удалён без возможности восстановить.',
        requireWord: 'Удалить',
        onConfirm: async () => {
          try {
            await dbWrite('projects', 'delete', null, { id: currentProjectId });
          } catch (e) { showToast('Ошибка: ' + e.message); return; }
          currentProjectId = null;
          await returnToPreviousView();
        }
      });
    });

    // ---------- Детали (sections) ----------

    // Меняет местами позиции двух соседних деталей (для ручной перестановки порядка)
    async function moveSection(sectionsList, index, direction) {
      const other = sectionsList[index + direction];
      const current = sectionsList[index];
      if (!other || !current) return;
      try {
        await dbWrite('sections', 'update', { position: other.position }, { id: current.id });
        await dbWrite('sections', 'update', { position: current.position }, { id: other.id });
      } catch (e) { showToast('Ошибка: ' + e.message); return; }
      loadSections();
    }

    async function loadSections() {
      const { data: sections, error } = await sb
        .from('sections')
        .select('*')
        .eq('project_id', currentProjectId)
        .order('position', { ascending: true });
      if (error) { showToast('Ошибка: ' + error.message); return; }

      // Личное состояние "свёрнуто/развёрнуто" по деталям (своё для каждого пользователя)
      const sectionIds = sections.map(s => s.id);
      let collapseState = {}; // section_id -> collapsed (true/false)
      if (sectionIds.length) {
        const { data: stateRows } = await sb
          .from('section_collapse_state')
          .select('section_id, collapsed')
          .eq('telegram_user_id', currentUserId)
          .in('section_id', sectionIds);
        (stateRows || []).forEach(s => { collapseState[s.section_id] = s.collapsed; });
      }

      sectionListEl.innerHTML = '';
      if (sectionCountChip) {
        sectionCountChip.textContent = sections.length + ' ' + pluralRu(sections.length, 'деталь', 'детали', 'деталей');
        sectionCountChip.style.display = sections.length ? '' : 'none';
      }
      if (!sections.length) {
        sectionListEl.appendChild(emptyMessage('Деталей пока нет. Загрузите PDF-схему или добавьте деталь вручную.'));
      }
      let sectionIndex = 0;
      for (const sec of sections) {
        const isFirstSection = sectionIndex === 0;
        const myIndex = sectionIndex; // фиксируем именно для этой детали — иначе к моменту клика значение "убежит" вперёд
        sectionIndex++;

        const block = document.createElement('div');
        block.className = 'section-block';

        const header = document.createElement('div');
        header.className = 'sec-header';

        const toggleArea = document.createElement('div');
        toggleArea.className = 'sec-toggle';
        toggleArea.setAttribute('role', 'button');
        toggleArea.tabIndex = 0;

        const badge = document.createElement('div');
        badge.className = 'part-badge';
        badge.style.background = 'var(--done-bg)';
        badge.style.color = 'var(--text-secondary)';
        badge.textContent = '…';
        toggleArea.appendChild(badge);

        const title = document.createElement('h2');
        title.style.flex = '1';
        title.textContent = sec.title;
        toggleArea.appendChild(title);

        const chevron = document.createElement('span');
        chevron.className = 'sec-chevron';
        chevron.innerHTML = icon('chevron', 20);
        toggleArea.appendChild(chevron);

        header.appendChild(toggleArea);

        const moveUpBtn = document.createElement('button');
        moveUpBtn.className = 'icon-btn';
        moveUpBtn.innerHTML = icon('up', 18);
        moveUpBtn.title = 'Переставить выше';
        moveUpBtn.setAttribute('aria-label', moveUpBtn.title);
        if (isFirstSection) moveUpBtn.style.visibility = 'hidden';
        moveUpBtn.addEventListener('click', () => moveSection(sections, myIndex, -1));
        header.appendChild(moveUpBtn);

        const moveDownBtn = document.createElement('button');
        moveDownBtn.className = 'icon-btn';
        moveDownBtn.innerHTML = icon('down', 18);
        moveDownBtn.title = 'Переставить ниже';
        moveDownBtn.setAttribute('aria-label', moveDownBtn.title);
        if (myIndex === sections.length - 1) moveDownBtn.style.visibility = 'hidden';
        moveDownBtn.addEventListener('click', () => moveSection(sections, myIndex, 1));
        header.appendChild(moveDownBtn);

        const secEditBtn = document.createElement('button');
        secEditBtn.className = 'icon-btn';
        secEditBtn.innerHTML = icon('edit', 18);
        secEditBtn.title = 'Редактировать деталь';
        secEditBtn.setAttribute('aria-label', secEditBtn.title);
        header.appendChild(secEditBtn);

        const secDelBtn = document.createElement('button');
        secDelBtn.className = 'icon-btn';
        secDelBtn.innerHTML = icon('trash', 18);
        secDelBtn.title = 'Удалить деталь';
        secDelBtn.setAttribute('aria-label', secDelBtn.title);
        if (!canDelete(currentProjectAuthor)) secDelBtn.style.display = 'none';
        header.appendChild(secDelBtn);

        block.appendChild(header);

        const metaEl = document.createElement('div');
        metaEl.className = 'sec-meta';
        if (sec.meta) metaEl.textContent = sec.meta;
        if (sec.meta) block.appendChild(metaEl);

        const secEditFormHolder = document.createElement('div');
        block.appendChild(secEditFormHolder);

        secEditBtn.addEventListener('click', () => {
          secEditFormHolder.innerHTML = '';
          const form = buildForm(
            [
              { name: 'title', label: 'Название детали', placeholder: 'Например: Голова' },
              { name: 'meta', label: 'Примечание (необязательно)', placeholder: 'Например: нить А, набивать по ходу' }
            ],
            async (values, formEl) => {
              if (!values.title) { showToast('Введите название детали'); return; }
              try {
                await dbWrite('sections', 'update', {
                  title: values.title,
                  meta: values.meta || null
                }, { id: sec.id });
              } catch (e) { showToast('Ошибка: ' + e.message); return; }
              formEl.remove();
              loadSections();
            },
            'Сохранить'
          );
          // предзаполняем текущими значениями
          const inputs = form.querySelectorAll('input');
          inputs[0].value = sec.title;
          inputs[1].value = sec.meta || '';
          secEditFormHolder.appendChild(form);
        });

        secDelBtn.addEventListener('click', () => {
          showConfirmModal({
            title: 'Удалить деталь?',
            message: 'Деталь "' + sec.title + '" и все её ряды будут удалены без возможности восстановить.',
            requireWord: 'Удалить',
            onConfirm: async () => {
              try {
                await dbWrite('sections', 'delete', null, { id: sec.id });
              } catch (e) { showToast('Ошибка: ' + e.message); return; }
              loadSections();
            }
          });
        });

        // ---------- Сворачиваемое тело детали (ряды + форма добавления) ----------
        const partBody = document.createElement('div');
        partBody.className = 'part-body';

        const rowsWrap = document.createElement('div');
        partBody.appendChild(rowsWrap);
        block._rowsWrap = rowsWrap;
        block._sectionTitle = sec.title;

        const rowFormHolder = document.createElement('div');
        partBody.appendChild(rowFormHolder);

        const addRowBtn = document.createElement('button');
        addRowBtn.className = 'secondary add-row-btn';
        addRowBtn.innerHTML = icon('plus', 18, 'currentColor', 2) + 'Добавить ряд';
        addRowBtn.addEventListener('click', () => {
          rowFormHolder.innerHTML = '';
          const form = buildForm(
            [
              { name: 'description', label: 'Описание ряда', placeholder: 'Например: ВК, 6 сбн' },
              { name: 'total', label: 'Итого петель в ряду (необязательно)', type: 'number', placeholder: 'Например: 6' },
              { name: 'note', label: 'Примечание (необязательно)', type: 'textarea', placeholder: 'Например: вставить глазки' }
            ],
            async (values, formEl) => {
              if (!values.description) { showToast('Введите описание ряда'); return; }
              await addRow(sec.id, rowsWrap, values);
              formEl.remove();
            },
            'Добавить ряд'
          );
          rowFormHolder.appendChild(form);
        });
        partBody.appendChild(addRowBtn);

        block.appendChild(partBody);

        // Состояние сворачивания: берём то, что пользователь сохранил в прошлый раз;
        // если для этой детали ещё ничего не сохранено — по умолчанию первая открыта, остальные свёрнуты
        const savedCollapsed = collapseState.hasOwnProperty(sec.id) ? collapseState[sec.id] : !isFirstSection;
        if (savedCollapsed) {
          partBody.style.display = 'none';
          chevron.style.transform = 'rotate(-90deg)';
        }
        toggleArea.setAttribute('aria-expanded', savedCollapsed ? 'false' : 'true');
        partBody._expand = () => { if (partBody.style.display === 'none') toggleArea.click(); };
        toggleArea.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleArea.click(); } });
        toggleArea.addEventListener('click', async () => {
          const willBeCollapsed = partBody.style.display !== 'none';
          partBody.style.display = willBeCollapsed ? 'none' : '';
          chevron.style.transform = willBeCollapsed ? 'rotate(-90deg)' : '';
          toggleArea.setAttribute('aria-expanded', willBeCollapsed ? 'false' : 'true');
          if (!willBeCollapsed && !partBody._autoExpand) {
            // раскрыли деталь вручную — значит, переходите к ней; панель внизу переключается на неё
            rowsWrap._lastTouched = Date.now();
            updateCurrentRow();
          }
          try {
            await dbWrite('section_collapse_state', 'upsert', {
              section_id: sec.id,
              telegram_user_id: currentUserId,
              collapsed: willBeCollapsed
            });
          } catch (e) { showToast('Ошибка сохранения: ' + e.message); }
        });

        sectionListEl.appendChild(block);
        await loadRows(sec.id, rowsWrap, badge);
      }
      updateCurrentRow();
    }

    document.getElementById('add-section-btn').addEventListener('click', () => {
      sectionFormHolder.innerHTML = '';
      const form = buildForm(
        [
          { name: 'title', label: 'Название детали', placeholder: 'Например: Голова' },
          { name: 'meta', label: 'Примечание (необязательно)', placeholder: 'Например: нить А, набивать по ходу' }
        ],
        async (values, formEl) => {
          if (!values.title) { showToast('Введите название детали'); return; }

          const { count } = await sb
            .from('sections')
            .select('*', { count: 'exact', head: true })
            .eq('project_id', currentProjectId);

          try {
            await dbWrite('sections', 'insert', {
              project_id: currentProjectId,
              title: values.title,
              meta: values.meta || null,
              position: count || 0
            });
          } catch (e) { showToast('Ошибка: ' + e.message); return; }
          formEl.remove();
          loadSections();
        },
        'Добавить деталь'
      );
      sectionFormHolder.appendChild(form);
    });

    // ---------- Ряды (rows) ----------
    async function loadRows(sectionId, container, badgeEl) {
      badgeEl = badgeEl || container._badgeEl;
      container._badgeEl = badgeEl;

      const { data: rows, error } = await sb
        .from('rows')
        .select('*')
        .eq('section_id', sectionId)
        .order('position', { ascending: true });
      if (error) { showToast('Ошибка: ' + error.message); return; }

      const rowIds = rows.map(r => r.id);
      const checkedSet = await loadRowProgress(rowIds);
      if (!container._lastTouched) container._lastTouched = checkedSet._lastTouched || 0;

      function updateBadge() {
        if (!badgeEl) return;
        const doneCount = rowIds.filter(id => checkedSet.has(id)).length;
        const total = rowIds.length;
        const complete = total > 0 && doneCount === total;
        badgeEl.textContent = complete ? '✓' : String(total - doneCount);
        badgeEl.style.background = complete ? 'var(--accent)' : 'var(--done-bg)';
        badgeEl.style.color = complete ? 'white' : 'var(--text)';
        badgeEl.setAttribute('aria-label', complete ? 'Деталь связана' : 'Осталось рядов: ' + (total - doneCount));
      }
      updateBadge();

      container.innerHTML = '';
      const checkboxRefs = []; // для каскадной отметки — все чекбоксы этой детали по порядку
      rows.forEach((r, idx) => {
        const isChecked = checkedSet.has(r.id);
        const item = document.createElement('div');
        item.className = 'row-item' + (isChecked ? ' done' : '');

        const num = document.createElement('div');
        num.className = 'row-num';
        num.textContent = r.row_number;

        const textWrap = document.createElement('div');
        textWrap.className = 'row-text';

        const desc = document.createElement('div');
        desc.className = 'row-desc';
        desc.textContent = r.description;
        textWrap.appendChild(desc);

        if (r.total_stitches) {
          const sts = document.createElement('div');
          sts.className = 'row-sts';
          sts.textContent = r.total_stitches + ' ' + pluralRu(r.total_stitches, 'петля', 'петли', 'петель');
          textWrap.appendChild(sts);
        }

        if (r.note) {
          const note = document.createElement('div');
          note.className = 'row-note';
          note.textContent = r.note;
          textWrap.appendChild(note);
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'row-check';
        checkbox.checked = isChecked;
        checkbox.setAttribute('aria-label', 'Ряд ' + r.row_number + ' связан');
        checkboxRefs.push({ checkbox, item, rowId: r.id, rowNumber: r.row_number, description: r.description });

        checkbox.addEventListener('change', async () => {
          if (checkbox.checked) {
            // отмечаем этот ряд и все НЕотмеченные ряды выше него в этой детали
            const toCheck = checkboxRefs.slice(0, idx + 1).filter(ref => !checkedSet.has(ref.rowId));
            toCheck.forEach(ref => {
              checkedSet.add(ref.rowId);
              ref.checkbox.checked = true;
              ref.item.classList.add('done');
            });
            if (toCheck.length) {
              try {
                await dbWrite('row_progress', 'upsert',
                  toCheck.map(ref => ({ row_id: ref.rowId, telegram_user_id: currentUserId, checked: true }))
                );
              } catch (e) { showToast('Ошибка сохранения: ' + e.message); }
            }
          } else {
            // снимаем этот ряд и все ОТМЕЧЕННЫЕ ряды ниже него в этой детали
            const toUncheck = checkboxRefs.slice(idx).filter(ref => checkedSet.has(ref.rowId));
            toUncheck.forEach(ref => {
              checkedSet.delete(ref.rowId);
              ref.checkbox.checked = false;
              ref.item.classList.remove('done');
            });
            if (toUncheck.length) {
              try {
                await dbWrite('row_progress', 'delete', null, {
                  telegram_user_id: currentUserId,
                  row_id: toUncheck.map(ref => ref.rowId)
                });
              } catch (e) { showToast('Ошибка сохранения: ' + e.message); }
            }
          }
          updateBadge();
          container._lastTouched = Date.now(); // эту деталь сейчас и вяжут
          updateCurrentRow();
        });

        const rowActions = document.createElement('div');
        rowActions.className = 'row-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'icon-btn';
        editBtn.innerHTML = icon('edit', 17);
        editBtn.title = 'Редактировать ряд';
        editBtn.setAttribute('aria-label', 'Редактировать ряд ' + r.row_number);
        editBtn.addEventListener('click', () => startEditRow(r, item, textWrap, sectionId, container));
        rowActions.appendChild(editBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn';
        delBtn.innerHTML = icon('trash', 17);
        delBtn.title = 'Удалить ряд';
        delBtn.setAttribute('aria-label', 'Удалить ряд ' + r.row_number);
        if (!canDelete(currentProjectAuthor)) delBtn.style.display = 'none';
        delBtn.addEventListener('click', () => {
          showConfirmModal({
            title: 'Удалить ряд?',
            message: 'Ряд №' + r.row_number + ' будет удалён без возможности восстановить.',
            onConfirm: async () => {
              try {
                await dbWrite('rows', 'delete', null, { id: r.id });
              } catch (e) { showToast('Ошибка: ' + e.message); return; }
              loadRows(sectionId, container);
            }
          });
        });
        rowActions.appendChild(delBtn);

        item.appendChild(num);
        item.appendChild(textWrap);
        item.appendChild(rowActions);
        item.appendChild(checkbox);
        container.appendChild(item);
      });
      container._refs = checkboxRefs;
      // при перерисовке одной детали (добавили/удалили ряд) пересчитываем текущий ряд;
      // при первой загрузке проекта это сделает loadSections после всех деталей
      if (container.isConnected) updateCurrentRow();
    }

    function startEditRow(r, item, textWrap, sectionId, container) {
      const form = document.createElement('div');
      form.className = 'inline-form';

      const descLabel = document.createElement('label');
      descLabel.textContent = 'Описание ряда';
      form.appendChild(descLabel);
      const descInput = document.createElement('input');
      descInput.value = r.description;
      form.appendChild(descInput);

      const totalLabel = document.createElement('label');
      totalLabel.textContent = 'Итого петель (необязательно)';
      form.appendChild(totalLabel);
      const totalInput = document.createElement('input');
      totalInput.type = 'number';
      totalInput.value = r.total_stitches || '';
      form.appendChild(totalInput);

      const noteLabel = document.createElement('label');
      noteLabel.textContent = 'Примечание (необязательно)';
      form.appendChild(noteLabel);
      const noteInput = document.createElement('textarea');
      noteInput.value = r.note || '';
      form.appendChild(noteInput);

      const actions = document.createElement('div');
      actions.className = 'form-actions';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Сохранить';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      form.appendChild(actions);

      textWrap.style.display = 'none';
      item.insertBefore(form, textWrap);

      cancelBtn.addEventListener('click', () => {
        form.remove();
        textWrap.style.display = '';
      });

      saveBtn.addEventListener('click', async () => {
        const description = descInput.value.trim();
        if (!description) { showToast('Введите описание ряда'); return; }
        try {
          await dbWrite('rows', 'update', {
            description,
            total_stitches: totalInput.value ? parseInt(totalInput.value, 10) : null,
            note: noteInput.value.trim() || null
          }, { id: r.id });
        } catch (e) { showToast('Ошибка: ' + e.message); return; }
        loadRows(sectionId, container);
      });
    }

    async function addRow(sectionId, container, values) {
      const { count } = await sb
        .from('rows')
        .select('*', { count: 'exact', head: true })
        .eq('section_id', sectionId);

      const nextNumber = (count || 0) + 1;

      try {
        await dbWrite('rows', 'insert', {
          section_id: sectionId,
          row_number: nextNumber,
          description: values.description,
          note: values.note || null,
          total_stitches: values.total ? parseInt(values.total, 10) : null,
          position: count || 0
        });
      } catch (e) { showToast('Ошибка: ' + e.message); return; }
      loadRows(sectionId, container);
    }

    // ---------- Безопасное имя файла для Supabase Storage ----------
    // Storage не разрешает кириллицу, пробелы и некоторые символы в пути к файлу,
    // поэтому сохраняем оригинальное имя только как caption, а путь строим из безопасных символов
    function safeFileName(originalName) {
      const dotIndex = originalName.lastIndexOf('.');
      const ext = dotIndex > -1 ? originalName.slice(dotIndex + 1).toLowerCase().replace(/[^a-z0-9]/g, '') : '';
      return 'file' + (ext ? '.' + ext : '');
    }

    // ---------- Фото готовой работы ----------
    const photoInput = document.getElementById('photo-input');
    const photoGalleryEl = document.getElementById('photo-gallery');

    document.getElementById('upload-photo-btn').addEventListener('click', () => {
      photoInput.click();
    });

    photoInput.addEventListener('change', async () => {
      const file = photoInput.files[0];
      if (!file) return;

      try {
        const filePath = currentProjectId + '/' + Date.now() + '_' + safeFileName(file.name);
        const { error: uploadError } = await sb.storage.from('photos').upload(filePath, file);
        if (uploadError) { showToast('Ошибка загрузки фото: ' + uploadError.message); return; }

        try {
          await dbWrite('photos', 'insert', {
            project_id: currentProjectId,
            url: urlData.publicUrl
          });
        } catch (e) { showToast('Ошибка сохранения фото: ' + e.message); return; }

        showToast('Фото добавлено!');
        await loadProjectPhotos();
        await loadPhotoMap();

      } catch (err) {
        showToast('Ошибка: ' + err.message);
      } finally {
        photoInput.value = '';
      }

    async function loadProjectPhotos() {
      const { data, error } = await sb
        .from('photos')
        .select('*')
        .eq('project_id', currentProjectId)
        .order('created_at', { ascending: false });

      (data || []).forEach(ph => {

    // ---------- Загрузка и разбор PDF ----------
    const pdfInput = document.getElementById('pdf-input');
    const pdfLoading = document.getElementById('pdf-loading');
    const pdfLoadingText = document.getElementById('pdf-loading-text');

    document.getElementById('upload-pdf-btn').addEventListener('click', () => {
      pdfInput.click();
    });

    pdfInput.addEventListener('change', async () => {
      const file = pdfInput.files[0];
      if (!file) return;

      // Предупреждаем, если в проекте уже есть детали — чтобы случайно не задублировать,
      // если предыдущая попытка загрузки на самом деле уже успела сохраниться
      const { count: existingCount } = await sb
        .from('sections')
        .select('*', { count: 'exact', head: true })
        .eq('project_id', currentProjectId);

      if (existingCount && existingCount > 0) {
        showConfirmModal({
          title: 'В проекте уже есть детали',
          message: 'Сейчас в проекте уже ' + existingCount + ' дет' + (existingCount === 1 ? 'аль' : 'алей') +
            '. Если ты уже загружала эту схему раньше — не загружай повторно, иначе детали задублируются. Продолжить?',
          onConfirm: () => processPdfUpload(file)
        });
        pdfInput.value = '';
        return;
      }

      processPdfUpload(file);
    });

    async function processPdfUpload(file) {
      pdfLoading.classList.add('active');
      pdfLoadingText.textContent = 'Загружаем файл в хранилище...';

      try {
        // --- 1. Загружаем PDF в Supabase Storage (лимит там намного больше, чем на Vercel) ---
        const filePath = currentProjectId + '/' + Date.now() + '_' + safeFileName(file.name);
        const { error: uploadError } = await sb.storage.from('schemas').upload(filePath, file);

        if (uploadError) {
          showToast('Ошибка загрузки файла: ' + uploadError.message);
          return;
        }

        const { data: urlData } = sb.storage.from('schemas').getPublicUrl(filePath);
        const pdfUrl = urlData.publicUrl;

        pdfLoadingText.textContent = 'Разбираем схему (это может занять несколько минут)...';

        const resp = await fetch('/api/parse-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pdfUrl })
        });

        const result = await resp.json();

        if (!resp.ok || result.error) {
          showToast('Ошибка: ' + (result.error || 'неизвестная ошибка'));
          return;
        }

        if (result.scanned) {
          showToast(result.message);
          return;
        }

        if (!result.sections || !result.sections.length) {
          showToast('Нейронка не смогла найти детали в этом файле');
          return;
        }

        pdfLoadingText.textContent = 'Сохраняем в базу...';
        await saveParsedSections(result.sections);

        if (result.coverImageBase64) {
          await saveCoverImage(result.coverImageBase64);
        }

        showToast('Готово! Добавлено деталей: ' + result.sections.length);
        await loadProjectPhotos();
        await loadPhotoMap();
        loadSections();

      } catch (err) {
        showToast('Ошибка: ' + err.message);
      } finally {
        pdfLoading.classList.remove('active');
        pdfInput.value = '';
      }
    }

    // ---------- Сохранение картинки-обложки, извлечённой из PDF ----------
    async function saveCoverImage(base64) {
      try {
        const byteChars = atob(base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'image/jpeg' });

        const filePath = currentProjectId + '/' + Date.now() + '_cover.jpg';
        const { error: uploadError } = await sb.storage.from('photos').upload(filePath, blob);
        if (uploadError) return; // не критично, просто не будет обложки

        const { data: urlData } = sb.storage.from('photos').getPublicUrl(filePath);
        await dbWrite('photos', 'insert', {
          project_id: currentProjectId,
          url: urlData.publicUrl,
          caption: 'Обложка из PDF'
        });
      } catch (e) {
        // тихо игнорируем — обложка не обязательна для работы приложения
      }
    }

    async function saveParsedSections(sections) {
      // узнаём, сколько деталей уже есть в проекте, чтобы продолжить нумерацию position
      const { count: existingSectionsCount } = await sb
        .from('sections')
        .select('*', { count: 'exact', head: true })
        .eq('project_id', currentProjectId);

      let sectionPosition = existingSectionsCount || 0;

      for (const sec of sections) {
        let newSection;
        try {
          const rowsRes = await dbWrite('sections', 'insert', {
            project_id: currentProjectId,
            title: sec.title,
            meta: sec.meta || null,
            position: sectionPosition
          }, null, true);
          newSection = rowsRes[0];
        } catch (e) { showToast('Ошибка сохранения детали: ' + e.message); continue; }
        sectionPosition++;

        // Разворачиваем компактные повторяющиеся ряды в отдельные строки базы —
        // нейронка присылает их "свёрнутыми", чтобы не тратить время на выписывание
        // одинаковых рядов много раз подряд. Два формата:
        //  - { repeat: N } — один и тот же ряд повторяется N раз подряд
        //  - { groupRepeat: N, rows: [...] } — НЕСКОЛЬКО рядов чередуются между собой N раз
        //    (например ряд A, ряд B, ряд A, ряд B, ... — так вяжется подкладка шляпки)
        const rowsToInsert = [];
        let rowNumber = 1;
        let lastTwoRaw = []; // последние 2 обработанных "сырых" ряда — на случай подстраховки ниже

        function pushRow(r) {
          rowsToInsert.push({
            section_id: newSection.id,
            row_number: rowNumber,
            description: r.description,
            note: r.note || null,
            total_stitches: r.total || null,
            position: rowNumber - 1
          });
          rowNumber++;
        }

        // Подстраховка: иногда нейронка вместо структуры groupRepeat просто пересказывает
        // словами "повторите ряд 02 и ряд 03 всего 28 раз" — распознаём такую фразу и
        // разворачиваем сами, чередуя два предыдущих ряда, вместо того чтобы сохранить
        // как один непонятный текстовый ряд
        function detectRepeatPhrase(text) {
          if (!text) return null;
          const match = text.match(/повтор\S*.{0,60}?(\d+)\s*раз/i);
          return match ? parseInt(match[1], 10) : null;
        }

        (sec.rows || []).forEach(r => {
          if (r.groupRepeat && Array.isArray(r.rows)) {
            const times = r.groupRepeat > 0 ? r.groupRepeat : 1;
            for (let i = 0; i < times; i++) {
              r.rows.forEach(inner => pushRow(inner));
            }
            lastTwoRaw = r.rows.slice(-2);
            return;
          }

          const repeatTimes = detectRepeatPhrase(r.description);
          if (repeatTimes && repeatTimes > 1 && lastTwoRaw.length === 2) {
            // это и есть словесная инструкция про повтор — не сохраняем её как отдельный ряд,
            // а достраиваем чередование двух предыдущих рядов до нужного количества раз
            for (let i = 1; i < repeatTimes; i++) {
              lastTwoRaw.forEach(inner => pushRow(inner));
            }
            return;
          }

          const times = r.repeat && r.repeat > 1 ? r.repeat : 1;
          for (let i = 0; i < times; i++) pushRow(r);
          lastTwoRaw = [r, r];
        });

        if (rowsToInsert.length) {
          try {
            await dbWrite('rows', 'insert', rowsToInsert);
          } catch (e) { showToast('Ошибка сохранения рядов: ' + e.message); }
        }
      }
    }

    // ---------- Старт ----------
    async function init() {
      renderAppHeader(null, null, null, null);
      try {
        await loadCategories();
        await loadTags();
        await loadPhotoMap();
        await loadProjects();
        viewCategories.style.display = 'block';
        document.getElementById('nav-home').classList.add('active');
        renderCategoryGrid();
        await renderRecentProjects();
        statusEl.textContent = '';
      } catch (e) {
        // раньше при любой ошибке на старте загрузка молча зависала на «Подключаемся к базе...»
        statusEl.textContent = 'Не удалось подключиться к базе. Проверьте интернет и откройте приложение заново.';
        showToast('Ошибка загрузки: ' + e.message);
      }
    }
    init();
  </script>
