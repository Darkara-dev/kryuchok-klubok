<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крючок и клубок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --border:#e5ded2;
    --text:#3a332a; --text-secondary:#8a7f6c; --accent:#c95a3a; --done-bg:#eef4e6;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,sans-serif;
    background:var(--tg-theme-bg-color, var(--bg));
    color:var(--tg-theme-text-color, var(--text));
    padding:16px; margin:0; padding-bottom:60px;
  }
  h1{font-size:20px; margin:0 0 4px;}
  h2{font-size:17px; margin:0;}
  #status{color:var(--text-secondary); font-size:13px; margin-bottom:14px;}
  button{
    background:var(--accent); color:white; border:none;
    padding:10px 14px; border-radius:8px; font-size:14px; margin:4px 4px 4px 0;
    cursor:pointer;
  }
  button.secondary{ background:var(--card); color:var(--text); border:1px solid var(--border); }
  .back-btn{ background:none; color:var(--accent); padding:4px 0; font-size:14px; }
  .project-item, .section-block, .row-item{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:12px; margin-bottom:10px;
  }
  .project-item{ cursor:pointer; }
  .project-badges{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .badge-cat{
    font-size:11px; background:#f0e6da; color:#8a6a3a; padding:3px 8px; border-radius:6px;
  }
  .badge-tag{
    font-size:11px; background:var(--done-bg); color:#5c7a3a; padding:3px 8px; border-radius:6px;
  }
  .tag-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .tag-pill{
    font-size:12px; padding:5px 10px; border-radius:14px; border:1px solid var(--border);
    background:white; color:var(--text-secondary); cursor:pointer;
  }
  .tag-pill.selected{ background:var(--accent); color:white; border-color:var(--accent); }
  .new-tag-row{ display:flex; gap:6px; margin-top:8px; }
  .new-tag-row input{ flex:1; padding:7px 9px; border:1px solid var(--border); border-radius:7px; font-size:13px; }
  .new-tag-row button{ padding:7px 10px; font-size:12px; margin:0; }
  select.form-select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px;
    font-size:14px; font-family:inherit; background:white; color:var(--text);
  }
  .row-item{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; }
  .row-item.done{ background:var(--done-bg); }
  .row-item.done .row-desc{ text-decoration:line-through; color:#7a8a63; }
  .row-num{ font-weight:600; color:var(--text-secondary); min-width:22px; }
  .row-desc{ flex:1; font-size:14px; }
  .row-note{ font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .sec-meta{ font-size:12px; color:var(--text-secondary); margin:2px 0 8px; }
  #view-project, #view-list{ display:none; }

  .inline-form{
    background:#fbf9f5; border:1px solid var(--border); border-radius:10px;
    padding:12px; margin:8px 0 14px;
  }
  .inline-form label{ display:block; font-size:12px; color:var(--text-secondary); margin:8px 0 3px; }
  .inline-form label:first-child{ margin-top:0; }
  .inline-form input, .inline-form textarea{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px;
    font-size:14px; font-family:inherit; background:white; color:var(--text);
  }
  .inline-form textarea{ resize:vertical; min-height:44px; }
  .form-actions{ margin-top:12px; }

  #pdf-loading{
    display:none; align-items:center; gap:8px; margin:10px 0;
    font-size:13px; color:var(--text-secondary);
  }
  #pdf-loading.active{ display:flex; }
  .spinner{
    width:16px; height:16px; border:2px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #toast{
    position:fixed; left:16px; right:16px; bottom:16px;
    background:#8a3f27; color:white; padding:10px 14px; border-radius:8px;
    font-size:13px; display:none; z-index:10;
  }
</style>
</head>
<body>
  <h1>🧶 Крючок и клубок</h1>
  <p id="status">Подключаемся к базе...</p>

  <div id="view-list">
    <button id="add-project-btn">+ Новый проект</button>
    <div id="project-form-holder"></div>
    <input type="text" id="search-input" placeholder="Поиск по тегам или названию..." style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; margin:10px 0; font-family:inherit;">
    <div id="project-list"></div>
  </div>

  <div id="view-project">
    <button class="back-btn" id="back-btn">← Все проекты</button>
    <h2 id="project-title"></h2>
    <button id="upload-pdf-btn">📄 Загрузить PDF-схему</button>
    <button id="add-section-btn" class="secondary">Добавить деталь вручную</button>
    <input type="file" id="pdf-input" accept="application/pdf" style="display:none;">
    <div id="pdf-loading"><div class="spinner"></div><span id="pdf-loading-text">Разбираем схему...</span></div>
    <div id="section-form-holder"></div>
    <div id="section-list"></div>
  </div>

  <div id="toast"></div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const SUPABASE_URL = 'https://vcsgpauejnqznygdqxyo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MRJ8BbTV9cvAnygOzySE7A_k29SDSuD';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const statusEl = document.getElementById('status');
    const viewList = document.getElementById('view-list');
    const viewProject = document.getElementById('view-project');
    const projectListEl = document.getElementById('project-list');
    const sectionListEl = document.getElementById('section-list');
    const projectTitleEl = document.getElementById('project-title');
    const projectFormHolder = document.getElementById('project-form-holder');
    const sectionFormHolder = document.getElementById('section-form-holder');
    const toastEl = document.getElementById('toast');
    const searchInput = document.getElementById('search-input');

    let currentProjectId = null;
    let allCategories = [];
    let allTags = [];
    let projectsCache = [];

    // ---------- Уведомления об ошибках ----------
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      setTimeout(() => { toastEl.style.display = 'none'; }, 4000);
    }

    // ---------- Помощник: создать инлайн-форму ----------
    // fields: [{name, label, type: 'text'|'number'|'textarea', placeholder}]
    function buildForm(fields, onSubmit, submitLabel) {
      const form = document.createElement('div');
      form.className = 'inline-form';

      const inputs = {};
      fields.forEach(f => {
        const label = document.createElement('label');
        label.textContent = f.label;
        form.appendChild(label);

        const input = f.type === 'textarea'
          ? document.createElement('textarea')
          : document.createElement('input');
        if (f.type !== 'textarea') input.type = f.type || 'text';
        if (f.placeholder) input.placeholder = f.placeholder;
        form.appendChild(input);
        inputs[f.name] = input;
      });

      const actions = document.createElement('div');
      actions.className = 'form-actions';

      const saveBtn = document.createElement('button');
      saveBtn.textContent = submitLabel || 'Сохранить';
      actions.appendChild(saveBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(cancelBtn);

      form.appendChild(actions);

      cancelBtn.addEventListener('click', () => form.remove());
      saveBtn.addEventListener('click', async () => {
        const values = {};
        fields.forEach(f => { values[f.name] = inputs[f.name].value.trim(); });
        saveBtn.disabled = true;
        await onSubmit(values, form);
        saveBtn.disabled = false;
      });

      return form;
    }

    // ---------- Категории и теги (общие справочники) ----------
    async function loadCategories() {
      const { data, error } = await sb.from('categories').select('*').order('name');
      if (error) { showToast('Ошибка загрузки категорий: ' + error.message); return; }
      allCategories = data || [];
    }

    async function loadTags() {
      const { data, error } = await sb.from('tags').select('*').order('name');
      if (error) { showToast('Ошибка загрузки тегов: ' + error.message); return; }
      allTags = data || [];
    }

    function getCategoryName(id) {
      const cat = allCategories.find(c => c.id === id);
      return cat ? cat.name : null;
    }

    // ---------- Список проектов ----------
    async function loadProjects() {
      const { data, error } = await sb
        .from('projects')
        .select('*, project_tags(tags(name))')
        .order('created_at', { ascending: false });
      if (error) { showToast('Ошибка: ' + error.message); return; }
      projectsCache = data || [];
      statusEl.textContent = 'Проектов: ' + projectsCache.length;
      renderProjectList(searchInput.value.trim().toLowerCase());
    }

    function renderProjectList(filterText) {
      projectListEl.innerHTML = '';
      const filtered = projectsCache.filter(p => {
        if (!filterText) return true;
        const tagNames = (p.project_tags || []).map(pt => pt.tags?.name?.toLowerCase() || '');
        return p.name.toLowerCase().includes(filterText) || tagNames.some(t => t.includes(filterText));
      });

      if (!filtered.length) {
        const empty = document.createElement('p');
        empty.style.color = 'var(--text-secondary)';
        empty.style.fontSize = '13px';
        empty.textContent = filterText ? 'Ничего не найдено' : 'Пока нет проектов';
        projectListEl.appendChild(empty);
        return;
      }

      filtered.forEach(p => {
        const div = document.createElement('div');
        div.className = 'project-item';

        const name = document.createElement('div');
        name.textContent = p.name;
        div.appendChild(name);

        const badges = document.createElement('div');
        badges.className = 'project-badges';

        const subcatName = getCategoryName(p.subcategory_id);
        if (subcatName) {
          const catBadge = document.createElement('span');
          catBadge.className = 'badge-cat';
          catBadge.textContent = subcatName;
          badges.appendChild(catBadge);
        }

        (p.project_tags || []).forEach(pt => {
          if (!pt.tags?.name) return;
          const tagBadge = document.createElement('span');
          tagBadge.className = 'badge-tag';
          tagBadge.textContent = pt.tags.name;
          badges.appendChild(tagBadge);
        });

        if (badges.children.length) div.appendChild(badges);

        div.addEventListener('click', () => openProject(p.id, p.name));
        projectListEl.appendChild(div);
      });
    }

    searchInput.addEventListener('input', () => {
      renderProjectList(searchInput.value.trim().toLowerCase());
    });

    document.getElementById('add-project-btn').addEventListener('click', () => {
      projectFormHolder.innerHTML = '';
      projectFormHolder.appendChild(buildProjectForm());
    });

    function buildProjectForm() {
      const form = document.createElement('div');
      form.className = 'inline-form';

      // Название
      const nameLabel = document.createElement('label');
      nameLabel.textContent = 'Название проекта';
      form.appendChild(nameLabel);
      const nameInput = document.createElement('input');
      nameInput.placeholder = 'Например: Тыква-брелок';
      form.appendChild(nameInput);

      // Категория
      const catLabel = document.createElement('label');
      catLabel.textContent = 'Категория';
      form.appendChild(catLabel);
      const catSelect = document.createElement('select');
      catSelect.className = 'form-select';
      const catPlaceholder = document.createElement('option');
      catPlaceholder.textContent = 'Выберите категорию';
      catPlaceholder.value = '';
      catSelect.appendChild(catPlaceholder);
      allCategories.filter(c => !c.parent_id).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        catSelect.appendChild(opt);
      });
      form.appendChild(catSelect);

      // Подкатегория
      const subcatWrap = document.createElement('div');
      const subcatLabel = document.createElement('label');
      subcatLabel.textContent = 'Подкатегория';
      subcatWrap.appendChild(subcatLabel);
      const subcatSelect = document.createElement('select');
      subcatSelect.className = 'form-select';
      subcatSelect.disabled = true;
      const subcatPlaceholder = document.createElement('option');
      subcatPlaceholder.textContent = 'Сначала выберите категорию';
      subcatPlaceholder.value = '';
      subcatSelect.appendChild(subcatPlaceholder);
      subcatWrap.appendChild(subcatSelect);
      form.appendChild(subcatWrap);

      catSelect.addEventListener('change', () => {
        subcatSelect.innerHTML = '';
        const subcats = allCategories.filter(c => c.parent_id === catSelect.value);

        if (!catSelect.value) {
          subcatWrap.style.display = '';
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Сначала выберите категорию';
          subcatSelect.appendChild(opt);
          subcatSelect.disabled = true;
          return;
        }

        if (subcats.length === 1) {
          // Единственная подкатегория — выбираем автоматически, шаг не показываем
          subcatSelect.innerHTML = '';
          const opt = document.createElement('option');
          opt.value = subcats[0].id;
          opt.textContent = subcats[0].name;
          subcatSelect.appendChild(opt);
          subcatSelect.value = subcats[0].id;
          subcatWrap.style.display = 'none';
          return;
        }

        if (!subcats.length) {
          subcatWrap.style.display = '';
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Нет подкатегорий';
          subcatSelect.appendChild(opt);
          subcatSelect.disabled = true;
          return;
        }

        subcatWrap.style.display = '';
        subcatSelect.disabled = false;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Выберите подкатегорию';
        subcatSelect.appendChild(placeholder);
        subcats.forEach(sc => {
          const opt = document.createElement('option');
          opt.value = sc.id;
          opt.textContent = sc.name;
          subcatSelect.appendChild(opt);
        });
      });

      // Теги
      const tagsLabel = document.createElement('label');
      tagsLabel.textContent = 'Теги (необязательно)';
      form.appendChild(tagsLabel);
      const tagPicker = document.createElement('div');
      tagPicker.className = 'tag-picker';
      const selectedTagIds = new Set();

      function renderTagPills() {
        tagPicker.innerHTML = '';
        allTags.forEach(t => {
          const pill = document.createElement('span');
          pill.className = 'tag-pill' + (selectedTagIds.has(t.id) ? ' selected' : '');
          pill.textContent = t.name;
          pill.addEventListener('click', () => {
            if (selectedTagIds.has(t.id)) selectedTagIds.delete(t.id);
            else selectedTagIds.add(t.id);
            renderTagPills();
          });
          tagPicker.appendChild(pill);
        });
      }
      renderTagPills();
      form.appendChild(tagPicker);

      const newTagRow = document.createElement('div');
      newTagRow.className = 'new-tag-row';
      const newTagInput = document.createElement('input');
      newTagInput.placeholder = 'Новый тег...';
      const newTagBtn = document.createElement('button');
      newTagBtn.className = 'secondary';
      newTagBtn.textContent = 'Добавить тег';
      newTagRow.appendChild(newTagInput);
      newTagRow.appendChild(newTagBtn);
      form.appendChild(newTagRow);

      newTagBtn.addEventListener('click', async () => {
        const tagName = newTagInput.value.trim();
        if (!tagName) return;
        const { data, error } = await sb.from('tags').insert({ name: tagName }).select().single();
        if (error) { showToast('Ошибка: ' + error.message); return; }
        allTags.push(data);
        selectedTagIds.add(data.id);
        renderTagPills();
        newTagInput.value = '';
      });

      // Кнопки
      const actions = document.createElement('div');
      actions.className = 'form-actions';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Создать проект';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'secondary';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      form.appendChild(actions);

      cancelBtn.addEventListener('click', () => form.remove());

      saveBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        if (!name) { showToast('Введите название'); return; }
        if (!subcatSelect.value) { showToast('Выберите подкатегорию'); return; }

        saveBtn.disabled = true;

        const { data: newProject, error } = await sb
          .from('projects')
          .insert({ name, subcategory_id: subcatSelect.value })
          .select()
          .single();

        if (error) { showToast('Ошибка: ' + error.message); saveBtn.disabled = false; return; }

        if (selectedTagIds.size) {
          const rows = Array.from(selectedTagIds).map(tagId => ({ project_id: newProject.id, tag_id: tagId }));
          const { error: tagError } = await sb.from('project_tags').insert(rows);
          if (tagError) showToast('Проект создан, но теги не сохранились: ' + tagError.message);
        }

        form.remove();
        loadProjects();
      });

      return form;
    }

    // ---------- Открытие проекта ----------
    async function openProject(id, name) {
      currentProjectId = id;
      projectTitleEl.textContent = name;
      viewList.style.display = 'none';
      viewProject.style.display = 'block';
      sectionFormHolder.innerHTML = '';
      await loadSections();
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      currentProjectId = null;
      viewProject.style.display = 'none';
      viewList.style.display = 'block';
      loadProjects();
    });

    // ---------- Детали (sections) ----------
    async function loadSections() {
      const { data: sections, error } = await sb
        .from('sections')
        .select('*')
        .eq('project_id', currentProjectId)
        .order('position', { ascending: true });
      if (error) { showToast('Ошибка: ' + error.message); return; }

      sectionListEl.innerHTML = '';
      for (const sec of sections) {
        const block = document.createElement('div');
        block.className = 'section-block';

        const title = document.createElement('h2');
        title.textContent = sec.title;
        block.appendChild(title);

        if (sec.meta) {
          const meta = document.createElement('div');
          meta.className = 'sec-meta';
          meta.textContent = sec.meta;
          block.appendChild(meta);
        }

        const rowsWrap = document.createElement('div');
        block.appendChild(rowsWrap);

        const rowFormHolder = document.createElement('div');
        block.appendChild(rowFormHolder);

        const addRowBtn = document.createElement('button');
        addRowBtn.className = 'secondary';
        addRowBtn.textContent = '+ Добавить ряд';
        addRowBtn.addEventListener('click', () => {
          rowFormHolder.innerHTML = '';
          const form = buildForm(
            [
              { name: 'description', label: 'Описание ряда', placeholder: 'Например: ВК, 6 сбн' },
              { name: 'total', label: 'Итого петель в ряду (необязательно)', type: 'number', placeholder: 'Например: 6' },
              { name: 'note', label: 'Примечание (необязательно)', type: 'textarea', placeholder: 'Например: вставить глазки' }
            ],
            async (values, formEl) => {
              if (!values.description) { showToast('Введите описание ряда'); return; }
              await addRow(sec.id, rowsWrap, values);
              formEl.remove();
            },
            'Добавить ряд'
          );
          rowFormHolder.appendChild(form);
        });
        block.appendChild(addRowBtn);

        sectionListEl.appendChild(block);
        await loadRows(sec.id, rowsWrap);
      }
    }

    document.getElementById('add-section-btn').addEventListener('click', () => {
      sectionFormHolder.innerHTML = '';
      const form = buildForm(
        [
          { name: 'title', label: 'Название детали', placeholder: 'Например: Голова' },
          { name: 'meta', label: 'Примечание (необязательно)', placeholder: 'Например: нить А, набивать по ходу' }
        ],
        async (values, formEl) => {
          if (!values.title) { showToast('Введите название детали'); return; }

          const { count } = await sb
            .from('sections')
            .select('*', { count: 'exact', head: true })
            .eq('project_id', currentProjectId);

          const { error } = await sb.from('sections').insert({
            project_id: currentProjectId,
            title: values.title,
            meta: values.meta || null,
            position: count || 0
          });
          if (error) { showToast('Ошибка: ' + error.message); return; }
          formEl.remove();
          loadSections();
        },
        'Добавить деталь'
      );
      sectionFormHolder.appendChild(form);
    });

    // ---------- Ряды (rows) ----------
    async function loadRows(sectionId, container) {
      const { data: rows, error } = await sb
        .from('rows')
        .select('*')
        .eq('section_id', sectionId)
        .order('position', { ascending: true });
      if (error) { showToast('Ошибка: ' + error.message); return; }

      container.innerHTML = '';
      rows.forEach(r => {
        const item = document.createElement('div');
        item.className = 'row-item' + (r.checked ? ' done' : '');

        const num = document.createElement('div');
        num.className = 'row-num';
        num.textContent = r.row_number + '.';

        const textWrap = document.createElement('div');
        textWrap.style.flex = '1';

        const desc = document.createElement('div');
        desc.className = 'row-desc';
        desc.textContent = r.description + (r.total_stitches ? ' (' + r.total_stitches + ')' : '');
        textWrap.appendChild(desc);

        if (r.note) {
          const note = document.createElement('div');
          note.className = 'row-note';
          note.textContent = r.note;
          textWrap.appendChild(note);
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = r.checked;
        checkbox.addEventListener('change', async () => {
          item.classList.toggle('done', checkbox.checked);
          const { error } = await sb.from('rows').update({ checked: checkbox.checked }).eq('id', r.id);
          if (error) showToast('Ошибка сохранения: ' + error.message);
        });

        item.appendChild(num);
        item.appendChild(textWrap);
        item.appendChild(checkbox);
        container.appendChild(item);
      });
    }

    async function addRow(sectionId, container, values) {
      const { count } = await sb
        .from('rows')
        .select('*', { count: 'exact', head: true })
        .eq('section_id', sectionId);

      const nextNumber = (count || 0) + 1;

      const { error } = await sb.from('rows').insert({
        section_id: sectionId,
        row_number: nextNumber,
        description: values.description,
        note: values.note || null,
        total_stitches: values.total ? parseInt(values.total, 10) : null,
        position: count || 0
      });
      if (error) { showToast('Ошибка: ' + error.message); return; }
      loadRows(sectionId, container);
    }

    // ---------- Загрузка и разбор PDF ----------
    const pdfInput = document.getElementById('pdf-input');
    const pdfLoading = document.getElementById('pdf-loading');
    const pdfLoadingText = document.getElementById('pdf-loading-text');

    document.getElementById('upload-pdf-btn').addEventListener('click', () => {
      pdfInput.click();
    });

    pdfInput.addEventListener('change', async () => {
      const file = pdfInput.files[0];
      if (!file) return;

      pdfLoading.classList.add('active');
      pdfLoadingText.textContent = 'Загружаем файл в хранилище...';

      try {
        // --- 1. Загружаем PDF в Supabase Storage (лимит там намного больше, чем на Vercel) ---
        const filePath = currentProjectId + '/' + Date.now() + '_' + file.name;
        const { error: uploadError } = await sb.storage.from('schemas').upload(filePath, file);

        if (uploadError) {
          showToast('Ошибка загрузки файла: ' + uploadError.message);
          return;
        }

        const { data: urlData } = sb.storage.from('schemas').getPublicUrl(filePath);
        const pdfUrl = urlData.publicUrl;

        pdfLoadingText.textContent = 'Разбираем схему (это может занять несколько минут)...';

        const resp = await fetch('/api/parse-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pdfUrl })
        });

        const result = await resp.json();

        if (!resp.ok || result.error) {
          showToast('Ошибка: ' + (result.error || 'неизвестная ошибка'));
          return;
        }

        if (result.scanned) {
          showToast(result.message);
          return;
        }

        if (!result.sections || !result.sections.length) {
          showToast('Нейронка не смогла найти детали в этом файле');
          return;
        }

        pdfLoadingText.textContent = 'Сохраняем в базу...';
        await saveParsedSections(result.sections);

        showToast('Готово! Добавлено деталей: ' + result.sections.length);
        loadSections();

      } catch (err) {
        showToast('Ошибка: ' + err.message);
      } finally {
        pdfLoading.classList.remove('active');
        pdfInput.value = '';
      }
    });

    async function saveParsedSections(sections) {
      // узнаём, сколько деталей уже есть в проекте, чтобы продолжить нумерацию position
      const { count: existingSectionsCount } = await sb
        .from('sections')
        .select('*', { count: 'exact', head: true })
        .eq('project_id', currentProjectId);

      let sectionPosition = existingSectionsCount || 0;

      for (const sec of sections) {
        const { data: newSection, error: secError } = await sb
          .from('sections')
          .insert({
            project_id: currentProjectId,
            title: sec.title,
            meta: sec.meta || null,
            position: sectionPosition
          })
          .select()
          .single();

        if (secError) { showToast('Ошибка сохранения детали: ' + secError.message); continue; }
        sectionPosition++;

        const rowsToInsert = (sec.rows || []).map((r, idx) => ({
          section_id: newSection.id,
          row_number: idx + 1,
          description: r.description,
          note: r.note || null,
          total_stitches: r.total || null,
          position: idx
        }));

        if (rowsToInsert.length) {
          const { error: rowsError } = await sb.from('rows').insert(rowsToInsert);
          if (rowsError) showToast('Ошибка сохранения рядов: ' + rowsError.message);
        }
      }
    }

    // ---------- Старт ----------
    async function init() {
      viewList.style.display = 'block';
      await loadCategories();
      await loadTags();
      await loadProjects();
    }
    init();
  </script>
</body>
</html>
